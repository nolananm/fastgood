<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FastGood - Mode Gestion (Staff)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { neon: '#FF0055', dark: '#0a0a0a', darker: '#050505' } } } }
    </script>
</head>
<body class="bg-dark text-white font-sans antialiased h-screen flex overflow-hidden relative">

    <!-- ECRAN AUTHENTIFICATION -->
    <div id="auth-screen" class="fixed inset-0 bg-darker z-50 flex items-center justify-center">
        <div class="bg-dark border border-white/10 p-8 rounded-2xl w-full max-w-md">
            <div class="text-3xl font-black mb-6 text-center">GESTION <span class="text-neon">STAFF</span></div>
            <div class="space-y-4">
                <input type="email" id="staff-email" placeholder="Email Admin" class="w-full bg-darker border border-white/20 rounded-lg px-4 py-3 focus:border-neon outline-none">
                <input type="password" id="staff-password" placeholder="Mot de passe" class="w-full bg-darker border border-white/20 rounded-lg px-4 py-3 focus:border-neon outline-none">
                <button onclick="loginStaff()" class="w-full bg-neon text-white font-black py-3 rounded-xl hover:bg-white hover:text-neon transition">CONNEXION</button>
                <p id="auth-error" class="text-red-500 text-sm text-center hidden"></p>
            </div>
        </div>
    </div>

    <!-- MODALS (Catégorie, Produit, Promo) -->
    <div id="add-category-modal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center">
        <div class="bg-darker border border-white/10 p-8 rounded-2xl w-full max-w-md relative">
            <button onclick="toggleModal('add-category-modal', false)" class="absolute top-4 right-4 text-gray-400 hover:text-white font-bold text-xl">X</button>
            <h2 class="text-2xl font-black mb-6">Nouvelle Catégorie</h2>
            <div class="space-y-4">
                <input type="text" id="cat-name" placeholder="Nom (Ex: Burgers, Salades...)" class="w-full bg-dark border border-white/20 rounded-lg px-4 py-3 outline-none">
                <button onclick="submitCategory()" class="w-full bg-white text-dark font-black py-3 rounded-xl mt-4 hover:bg-neon hover:text-white transition">CRÉER</button>
            </div>
        </div>
    </div>

    <div id="add-product-modal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center">
        <div class="bg-darker border border-white/10 p-8 rounded-2xl w-full max-w-md relative">
            <button onclick="toggleModal('add-product-modal', false)" class="absolute top-4 right-4 text-gray-400 hover:text-white font-bold text-xl">X</button>
            <h2 class="text-2xl font-black mb-6">Nouveau Plat</h2>
            <div class="space-y-4">
                <input type="text" id="prod-name" placeholder="Nom (Ex: Maxi Cheese)" class="w-full bg-dark border border-white/20 rounded-lg px-4 py-2 outline-none">
                <div class="flex gap-4">
                    <input type="number" step="0.10" id="prod-price" placeholder="Prix (€)" class="w-full bg-dark border border-white/20 rounded-lg px-4 py-2 outline-none">
                    <input type="number" id="prod-time" placeholder="Temps (sec)" class="w-full bg-dark border border-white/20 rounded-lg px-4 py-2 outline-none">
                </div>
                <select id="prod-category" class="w-full bg-dark border border-white/20 rounded-lg px-4 py-2 outline-none appearance-none"></select>
                <input type="text" id="prod-image" placeholder="Image (URL courte ou texte)" class="w-full bg-dark border border-white/20 rounded-lg px-4 py-2 outline-none">
                <button onclick="submitProduct()" class="w-full bg-white text-dark font-black py-3 rounded-xl mt-4 hover:bg-neon hover:text-white transition">CRÉER LE PLAT</button>
            </div>
        </div>
    </div>

    <div id="add-promo-modal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center">
        <div class="bg-darker border border-white/10 p-8 rounded-2xl w-full max-w-md relative">
            <button onclick="toggleModal('add-promo-modal', false)" class="absolute top-4 right-4 text-gray-400 hover:text-white font-bold text-xl">X</button>
            <h2 class="text-2xl font-black mb-6">Nouveau Code PromoGood</h2>
            <div class="space-y-4">
                <input type="text" id="promo-code" placeholder="Code (Ex: GOOD10)" class="w-full uppercase bg-dark border border-white/20 rounded-lg px-4 py-2 outline-none">
                <select id="promo-type" class="w-full bg-dark border border-white/20 rounded-lg px-4 py-2 outline-none appearance-none">
                    <option value="percent">Remise en Pourcentage (%)</option>
                    <option value="amount">Remise Fixe (€)</option>
                    <option value="points">Points FidGood Offerts</option>
                </select>
                <div class="flex gap-4">
                    <input type="number" step="0.10" id="promo-value" placeholder="Valeur" class="w-full bg-dark border border-white/20 rounded-lg px-4 py-2 outline-none">
                    <input type="number" id="promo-max" placeholder="Utilisations Max" class="w-full bg-dark border border-white/20 rounded-lg px-4 py-2 outline-none">
                </div>
                <button onclick="submitPromo()" class="w-full bg-neon text-white font-black py-3 rounded-xl mt-4 hover:bg-white hover:text-neon transition">CRÉER LE CODE</button>
            </div>
        </div>
    </div>

    <!-- APPLICATION STAFF -->
    <div id="app-screen" class="hidden flex-1 flex h-full">
        <!-- Sidebar -->
        <aside class="w-64 bg-darker border-r border-white/10 flex flex-col">
            <div class="h-20 flex items-center px-6 border-b border-white/10">
                <span class="text-xl font-black text-white">STAFF<span class="text-neon">GOOD</span></span>
            </div>
            <nav class="flex-1 p-4 space-y-2">
                <button onclick="switchTab('sec-carte')" id="tab-sec-carte" class="w-full text-left px-4 py-3 bg-neon/10 text-neon rounded-xl font-bold transition tab-btn">Gestion Carte</button>
                <button onclick="switchTab('sec-commandes')" id="tab-sec-commandes" class="w-full text-left px-4 py-3 text-gray-400 hover:text-white hover:bg-white/5 rounded-xl transition tab-btn">Commandes Live</button>
                <button onclick="switchTab('sec-promo')" id="tab-sec-promo" class="w-full text-left px-4 py-3 text-gray-400 hover:text-white hover:bg-white/5 rounded-xl transition tab-btn">Codes PromoGood</button>
                <button onclick="switchTab('sec-mails')" id="tab-sec-mails" class="w-full text-left px-4 py-3 text-gray-400 hover:text-white hover:bg-white/5 rounded-xl transition tab-btn">Mails (Contact)</button>
            </nav>
            <div class="p-4 border-t border-white/10">
                <button onclick="logout()" class="w-full text-left px-4 py-2 text-sm text-red-500 hover:text-white font-bold">Verrouiller</button>
            </div>
        </aside>

        <!-- Contenu -->
        <main class="flex-1 overflow-y-auto p-8 relative">
            <button onclick="loadStaffData()" class="absolute top-8 right-8 border border-white/20 px-4 py-2 rounded-full text-sm hover:bg-white/10 transition">Rafraîchir</button>

            <!-- CARTE -->
            <div id="sec-carte" class="tab-content block">
                <div class="flex justify-between items-center mb-6">
                    <h1 class="text-3xl font-black">Carte Actuelle</h1>
                    <div class="flex gap-4">
                        <button onclick="toggleModal('add-category-modal', true)" class="border border-white/20 text-white px-4 py-2 rounded-full font-bold hover:bg-white/10 transition">+ Catégorie</button>
                        <button onclick="toggleModal('add-product-modal', true)" class="bg-white text-dark px-4 py-2 rounded-full font-bold hover:bg-gray-200 transition">+ Nouveau Plat</button>
                    </div>
                </div>
                <div class="bg-darker border border-white/10 rounded-2xl overflow-hidden">
                    <table class="w-full text-left"><thead class="bg-white/5 border-b border-white/10 text-gray-400 text-sm"><tr><th class="p-4">Produit</th><th class="p-4">Prix</th><th class="p-4">Temps</th><th class="p-4">Statut</th></tr></thead><tbody id="products-list" class="divide-y divide-white/10"></tbody></table>
                </div>
            </div>

            <!-- COMMANDES (AVEC GESTION DES STATUTS) -->
            <div id="sec-commandes" class="tab-content hidden">
                <h1 class="text-3xl font-black text-neon mb-6">Commandes en cuisine</h1>
                <div class="bg-darker border border-white/10 rounded-2xl overflow-hidden">
                    <table class="w-full text-left"><thead class="bg-white/5 border-b border-white/10 text-gray-400 text-sm"><tr><th class="p-4">N° Commande</th><th class="p-4">Total</th><th class="p-4">Temps</th><th class="p-4">Statut</th></tr></thead><tbody id="orders-list" class="divide-y divide-white/10"></tbody></table>
                </div>
            </div>

            <!-- PROMO -->
            <div id="sec-promo" class="tab-content hidden">
                <div class="flex justify-between items-center mb-6">
                    <h1 class="text-3xl font-black">Codes PromoGood</h1>
                    <button onclick="toggleModal('add-promo-modal', true)" class="bg-neon text-white px-4 py-2 rounded-full font-bold hover:bg-white hover:text-neon transition">+ Nouveau Code</button>
                </div>
                <div class="bg-darker border border-white/10 rounded-2xl overflow-hidden">
                    <table class="w-full text-left"><thead class="bg-white/5 border-b border-white/10 text-gray-400 text-sm"><tr><th class="p-4">Code</th><th class="p-4">Type</th><th class="p-4">Valeur</th><th class="p-4">Utilisations</th></tr></thead><tbody id="promo-list" class="divide-y divide-white/10"></tbody></table>
                </div>
            </div>

            <!-- MAILS -->
            <div id="sec-mails" class="tab-content hidden">
                <h1 class="text-3xl font-black mb-6">Messages de contact</h1>
                <div class="bg-darker border border-white/10 rounded-2xl overflow-hidden">
                    <table class="w-full text-left"><thead class="bg-white/5 border-b border-white/10 text-gray-400 text-sm"><tr><th class="p-4">Date</th><th class="p-4">Email</th><th class="p-4">Message</th><th class="p-4">Statut</th></tr></thead><tbody id="mails-list" class="divide-y divide-white/10"></tbody></table>
                </div>
            </div>
        </main>
    </div>

    <!-- SCRIPT -->
    <script type="module">
        import { supabase } from './db.js';

        // Navigation
        window.switchTab = function(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.getElementById(tabId).classList.remove('hidden');
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('bg-neon/10', 'text-neon'); btn.classList.add('text-gray-400');
            });
            const activeBtn = document.getElementById('tab-' + tabId);
            activeBtn.classList.remove('text-gray-400'); activeBtn.classList.add('bg-neon/10', 'text-neon');
        };

        // Auth
        window.loginStaff = async function() {
            const email = document.getElementById('staff-email').value;
            const password = document.getElementById('staff-password').value;
            const { error } = await supabase.auth.signInWithPassword({ email, password });
            if (error) {
                document.getElementById('auth-error').innerText = "Identifiants incorrects.";
                document.getElementById('auth-error').classList.remove('hidden');
            } else { window.location.reload(); }
        };
        window.logout = async function() { await supabase.auth.signOut(); window.location.reload(); };

        async function checkAuthStatus() {
            const { data: { session } } = await supabase.auth.getSession();
            if (session) {
                document.getElementById('auth-screen').classList.add('hidden');
                document.getElementById('app-screen').classList.remove('hidden');
                loadStaffData(); loadCategories();
            }
        }

        window.toggleModal = function(modalId, show) {
            const modal = document.getElementById(modalId);
            if(show) modal.classList.remove('hidden'); else modal.classList.add('hidden');
        };

        // --- GESTION DU STATUT DES COMMANDES ---
        window.updateOrderStatus = async function(orderId, newStatus) {
            await supabase.from('orders').update({ status: newStatus }).eq('id', orderId);
            loadStaffData();
        };

        // Chargement Données
        window.loadStaffData = async function() {
            // Produits
            const { data: products } = await supabase.from('products').select('*, categories(name)').order('created_at', { ascending: false });
            document.getElementById('products-list').innerHTML = products?.length ? products.map(p => `
                <tr class="hover:bg-white/5 border-b border-white/5"><td class="p-4 font-bold">${p.image_url || ''} ${p.name} <span class="text-xs text-gray-500 font-normal block">${p.categories?.name || 'Sans catégorie'}</span></td><td class="p-4">${p.price.toFixed(2)} €</td><td class="p-4">${p.prep_time}s</td><td class="p-4"><span class="text-green-400 bg-green-400/10 px-2 py-1 rounded text-xs font-bold">En ligne</span></td></tr>
            `).join('') : '<tr><td colspan="4" class="p-4 text-center">Aucun produit.</td></tr>';

            // Commandes (AVEC BOUTONS)
            const { data: orders } = await supabase.from('orders').select('*').order('created_at', { ascending: false });
            document.getElementById('orders-list').innerHTML = orders?.length ? orders.map(o => {
                let btnStr = '';
                if (o.status === 'en_preparation') btnStr = `<button onclick="updateOrderStatus('${o.id}', 'prete')" class="bg-yellow-500 text-dark px-2 py-1 rounded text-xs font-bold hover:bg-white ml-2 transition">✅ Prête</button>`;
                else if (o.status === 'prete') btnStr = `<button onclick="updateOrderStatus('${o.id}', 'terminee')" class="bg-green-500 text-white px-2 py-1 rounded text-xs font-bold hover:bg-white hover:text-dark ml-2 transition">🏁 Terminée</button>`;
                
                let statusColor = o.status === 'terminee' ? 'text-gray-400 bg-white/5' : (o.status === 'prete' ? 'text-green-400 bg-green-400/10' : 'text-yellow-400 bg-yellow-400/10');

                return `<tr class="hover:bg-white/5 border-b border-white/5"><td class="p-4 font-bold text-neon">#${o.id.substring(0,6).toUpperCase()}</td><td class="p-4">${o.total_price.toFixed(2)} €</td><td class="p-4">${o.estimated_time}s</td><td class="p-4 flex items-center"><span class="${statusColor} px-2 py-1 rounded text-xs font-bold uppercase">${o.status.replace('_', ' ')}</span> ${btnStr}</td></tr>`;
            }).join('') : '<tr><td colspan="4" class="p-4 text-center">Aucune commande.</td></tr>';

            // Promos & Mails
            const { data: promos } = await supabase.from('promocodes').select('*');
            document.getElementById('promo-list').innerHTML = promos?.length ? promos.map(p => `<tr class="hover:bg-white/5 border-b border-white/5"><td class="p-4 font-bold uppercase">${p.code}</td><td class="p-4 text-gray-400">${p.discount_type}</td><td class="p-4 text-neon font-bold">${p.discount_value}</td><td class="p-4">${p.current_uses} / ${p.max_uses || '∞'}</td></tr>`).join('') : '<tr><td colspan="4" class="p-4 text-center">Aucun code.</td></tr>';

            const { data: mails } = await supabase.from('contact_messages').select('*').order('created_at', { ascending: false });
            document.getElementById('mails-list').innerHTML = mails?.length ? mails.map(m => `<tr class="hover:bg-white/5 border-b border-white/5"><td class="p-4 text-sm text-gray-400">${new Date(m.created_at).toLocaleDateString('fr-FR')}</td><td class="p-4 font-bold">${m.email}</td><td class="p-4 text-sm">${m.message}</td><td class="p-4"><span class="text-blue-400 bg-blue-400/10 px-2 py-1 rounded text-xs font-bold">Non lu</span></td></tr>`).join('') : '<tr><td colspan="4" class="p-4 text-center">Aucun message.</td></tr>';
        };

        // Soumissions
        async function loadCategories() {
            const { data } = await supabase.from('categories').select('*');
            document.getElementById('prod-category').innerHTML = data && data.length > 0 ? data.map(c => `<option value="${c.id}">${c.name}</option>`).join('') : '<option value="">Aucune catégorie disponible</option>';
        }

        window.submitCategory = async function() {
            const name = document.getElementById('cat-name').value;
            if(!name) return alert("Renseignez un nom.");
            await supabase.from('categories').insert([{ name }]);
            toggleModal('add-category-modal', false); document.getElementById('cat-name').value = '';
            loadCategories();
        };

        window.submitProduct = async function() {
            const name = document.getElementById('prod-name').value;
            const price = parseFloat(document.getElementById('prod-price').value);
            const prep_time = parseInt(document.getElementById('prod-time').value);
            const category_id = document.getElementById('prod-category').value;
            const image_url = document.getElementById('prod-image').value;

            if(!name || isNaN(price) || isNaN(prep_time)) return alert("Remplissez nom, prix et temps.");
            if(!category_id) return alert("Créez d'abord une catégorie !");
            await supabase.from('products').insert([{ name, price, prep_time, category_id, image_url }]);
            toggleModal('add-product-modal', false);
            document.getElementById('prod-name').value = ''; document.getElementById('prod-price').value = ''; document.getElementById('prod-time').value = ''; document.getElementById('prod-image').value = '';
            loadStaffData();
        };

        window.submitPromo = async function() {
            const code = document.getElementById('promo-code').value.toUpperCase();
            const discount_type = document.getElementById('promo-type').value;
            const discount_value = parseFloat(document.getElementById('promo-value').value);
            const max_uses = parseInt(document.getElementById('promo-max').value);
            if(!code || isNaN(discount_value)) return alert("Remplissez code et valeur.");
            await supabase.from('promocodes').insert([{ code, discount_type, discount_value, max_uses: isNaN(max_uses) ? null : max_uses }]);
            toggleModal('add-promo-modal', false);
            document.getElementById('promo-code').value = ''; document.getElementById('promo-value').value = ''; document.getElementById('promo-max').value = '';
            loadStaffData();
        };

        checkAuthStatus();
    </script>
</body>
</html>
