<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FastGood - Staff</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { theme: { extend: { colors: { neon: '#FF0055', dark: '#0a0a0a', darker: '#050505', premium: '#1a1a1a' } } } }</script>
</head>
<body class="bg-dark text-white font-sans antialiased h-screen flex overflow-hidden">

    <div id="auth-screen" class="fixed inset-0 bg-darker z-50 flex items-center justify-center">
        <div class="bg-premium border border-white/10 p-10 w-full max-w-md text-center shadow-2xl">
            <h2 class="text-3xl font-black mb-8 tracking-wide">GESTION <span class="text-neon">STAFF</span></h2>
            <div class="space-y-4">
                <input type="email" id="staff-email" placeholder="Email Admin" class="w-full bg-dark border border-white/10 px-4 py-3 outline-none focus:border-neon transition text-sm">
                <input type="password" id="staff-password" placeholder="Mot de passe" class="w-full bg-dark border border-white/10 px-4 py-3 outline-none focus:border-neon transition text-sm">
                <button onclick="loginStaff()" class="w-full bg-neon text-white font-black py-4 uppercase tracking-widest hover:bg-white hover:text-dark transition mt-4">Connexion</button>
                <p id="auth-error" class="text-neon text-sm hidden font-bold mt-4"></p>
            </div>
        </div>
    </div>

    <!-- MODALS -->
    <div id="modal-category" class="hidden fixed inset-0 bg-darker/95 backdrop-blur-sm z-50 flex items-center justify-center">
        <div class="bg-premium border border-white/10 p-8 w-full max-w-md relative shadow-2xl">
            <button onclick="toggleModal('modal-category', false)" class="absolute top-4 right-4 text-gray-500 font-black text-xl hover:text-white">X</button>
            <h2 class="text-2xl font-black mb-6 uppercase tracking-wide">Nouvelle Catégorie</h2>
            <input type="text" id="cat-name" placeholder="Nom (Ex: Burgers)" class="w-full bg-dark border border-white/10 px-4 py-3 mb-4 outline-none focus:border-neon transition">
            <button onclick="submitCategory()" class="w-full bg-white text-dark font-black py-3 uppercase tracking-widest hover:bg-neon hover:text-white transition">Créer</button>
        </div>
    </div>

    <div id="modal-product" class="hidden fixed inset-0 bg-darker/95 backdrop-blur-sm z-50 flex items-center justify-center">
        <div class="bg-premium border border-white/10 p-8 w-full max-w-md relative shadow-2xl">
            <button onclick="toggleModal('modal-product', false)" class="absolute top-4 right-4 text-gray-500 font-black text-xl hover:text-white">X</button>
            <h2 class="text-2xl font-black mb-6 uppercase tracking-wide">Nouveau Plat</h2>
            <div class="space-y-4">
                <input type="text" id="prod-name" placeholder="Nom du plat" class="w-full bg-dark border border-white/10 px-4 py-3 outline-none focus:border-neon transition">
                <div class="flex gap-4">
                    <input type="number" step="0.10" id="prod-price" placeholder="Prix (€)" class="w-full bg-dark border border-white/10 px-4 py-3 outline-none focus:border-neon transition">
                    <input type="number" id="prod-time" placeholder="Temps (sec)" class="w-full bg-dark border border-white/10 px-4 py-3 outline-none focus:border-neon transition">
                </div>
                <select id="prod-category" class="w-full bg-dark border border-white/10 px-4 py-3 outline-none focus:border-neon transition"></select>
                <button onclick="submitProduct()" class="w-full bg-neon text-white font-black py-4 uppercase tracking-widest hover:bg-white hover:text-dark transition">Créer le plat</button>
            </div>
        </div>
    </div>

    <div id="modal-promo" class="hidden fixed inset-0 bg-darker/95 backdrop-blur-sm z-50 flex items-center justify-center">
        <div class="bg-premium border border-white/10 p-8 w-full max-w-md relative shadow-2xl">
            <button onclick="toggleModal('modal-promo', false)" class="absolute top-4 right-4 text-gray-500 font-black text-xl hover:text-white">X</button>
            <h2 class="text-2xl font-black mb-6 uppercase tracking-wide">Code PromoGood</h2>
            <div class="space-y-4">
                <input type="text" id="promo-code" placeholder="Code (Ex: GOOD10)" class="w-full uppercase bg-dark border border-white/10 px-4 py-3 outline-none focus:border-neon transition">
                <select id="promo-type" class="w-full bg-dark border border-white/10 px-4 py-3 outline-none focus:border-neon transition">
                    <option value="percent">Remise (%)</option>
                    <option value="amount">Remise Fixe (€)</option>
                    <option value="points">Couronnes 👑</option>
                </select>
                <div class="flex gap-4">
                    <input type="number" step="0.10" id="promo-value" placeholder="Valeur" class="w-full bg-dark border border-white/10 px-4 py-3 outline-none focus:border-neon transition">
                    <input type="number" id="promo-max" placeholder="Utilisations Max" class="w-full bg-dark border border-white/10 px-4 py-3 outline-none focus:border-neon transition">
                </div>
                <button onclick="submitPromo()" class="w-full bg-neon text-white font-black py-4 uppercase tracking-widest hover:bg-white hover:text-dark transition">Créer le code</button>
            </div>
        </div>
    </div>

    <!-- APPLICATION -->
    <div id="app-screen" class="hidden flex-1 flex h-full">
        <aside class="w-64 bg-darker border-r border-white/5 flex flex-col">
            <div class="h-20 flex items-center px-6 border-b border-white/5 text-xl font-black tracking-tighter">STAFF<span class="text-neon">GOOD</span></div>
            <nav class="flex-1 p-4 space-y-2">
                <button onclick="switchTab('sec-carte')" id="tab-sec-carte" class="w-full text-left px-4 py-3 bg-neon/10 text-neon rounded font-bold uppercase tracking-widest text-xs transition tab-btn">Carte & Stocks</button>
                <button onclick="switchTab('sec-commandes')" id="tab-sec-commandes" class="w-full text-left px-4 py-3 text-gray-500 hover:text-white hover:bg-white/5 rounded font-bold uppercase tracking-widest text-xs transition tab-btn">Commandes Live</button>
                <button onclick="switchTab('sec-promo')" id="tab-sec-promo" class="w-full text-left px-4 py-3 text-gray-500 hover:text-white hover:bg-white/5 rounded font-bold uppercase tracking-widest text-xs transition tab-btn">Promos</button>
            </nav>
            <button onclick="logout()" class="p-6 text-gray-600 hover:text-neon text-xs font-bold uppercase tracking-widest border-t border-white/5 text-left transition">Verrouiller</button>
        </aside>

        <main class="flex-1 overflow-y-auto p-10 relative bg-dark">
            <button onclick="loadData()" class="absolute top-10 right-10 border border-white/10 text-xs font-bold uppercase tracking-widest px-4 py-2 hover:bg-white/10 transition">Rafraîchir</button>

            <div id="sec-carte" class="tab-content block">
                <div class="flex justify-between items-end mb-8 border-b border-white/5 pb-4">
                    <h1 class="text-3xl font-black uppercase tracking-wide">La Carte & Stocks</h1>
                    <div class="flex gap-4">
                        <button onclick="toggleModal('modal-category', true)" class="text-xs font-bold uppercase tracking-widest border border-white/20 text-white px-4 py-2 hover:bg-white/10 transition">Catégorie +</button>
                        <button onclick="toggleModal('modal-product', true)" class="text-xs font-bold uppercase tracking-widest bg-white text-dark px-4 py-2 hover:bg-neon hover:text-white transition">Nouveau Plat</button>
                    </div>
                </div>
                <div id="list-products-container" class="space-y-8"></div>
            </div>

            <div id="sec-commandes" class="tab-content hidden">
                <div class="flex justify-between items-end mb-8 border-b border-white/5 pb-4"><h1 class="text-3xl font-black uppercase tracking-wide">Cuisine</h1></div>
                <div class="bg-premium border border-white/5"><table class="w-full text-left"><thead class="bg-white/5 border-b border-white/5 text-gray-500 text-xs uppercase tracking-widest"><tr><th class="p-4">Commande</th><th class="p-4">Total</th><th class="p-4 text-right">Statut / Actions</th></tr></thead><tbody id="list-orders" class="divide-y divide-white/5 text-sm"></tbody></table></div>
            </div>

            <div id="sec-promo" class="tab-content hidden">
                <div class="flex justify-between items-end mb-8 border-b border-white/5 pb-4"><h1 class="text-3xl font-black uppercase tracking-wide">Codes Promo</h1><button onclick="toggleModal('modal-promo', true)" class="text-xs font-bold uppercase tracking-widest bg-white text-dark px-4 py-2 hover:bg-neon hover:text-white transition">Nouveau Code</button></div>
                <div class="bg-premium border border-white/5"><table class="w-full text-left"><thead class="bg-white/5 border-b border-white/5 text-gray-500 text-xs uppercase tracking-widest"><tr><th class="p-4">Code</th><th class="p-4">Avantage</th><th class="p-4">Utilisations</th><th class="p-4 text-right">Actions</th></tr></thead><tbody id="list-promos" class="divide-y divide-white/5 text-sm"></tbody></table></div>
            </div>
        </main>
    </div>

    <script type="module">
        import { supabase } from './db.js';
        let categories = []; 

        window.switchTab = function(id) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
            document.querySelectorAll('.tab-btn').forEach(b => { b.classList.remove('bg-neon/10', 'text-neon'); b.classList.add('text-gray-500'); });
            document.getElementById('tab-'+id).classList.add('bg-neon/10', 'text-neon');
        };

        window.toggleModal = function(id, show) { document.getElementById(id).classList.toggle('hidden', !show); };
        window.loginStaff = async function() {
            const email = document.getElementById('staff-email').value, password = document.getElementById('staff-password').value;
            const { error } = await supabase.auth.signInWithPassword({ email, password });
            if (error) { document.getElementById('auth-error').innerText = "Identifiants incorrects."; document.getElementById('auth-error').classList.remove('hidden'); } else { window.location.reload(); }
        };
        window.logout = async function() { await supabase.auth.signOut(); window.location.reload(); };

        async function checkAuth() {
            const { data: { session } } = await supabase.auth.getSession();
            if (session) {
                document.getElementById('auth-screen').classList.add('hidden');
                document.getElementById('app-screen').classList.remove('hidden');
                await loadData();
            }
        }

        window.updateOrderStatus = async function(id, status) { await supabase.from('orders').update({ status }).eq('id', id); loadData(); };
        window.deleteProduct = async function(id) { if(confirm('Supprimer définitivement ce plat ?')) { await supabase.from('products').delete().eq('id', id); loadData(); } };
        window.deletePromo = async function(code) { if(confirm(`Supprimer le code ${code} ?`)) { await supabase.from('promocodes').delete().eq('code', code); loadData(); } };
        
        window.moveProduct = async function(id, currentIndex, direction) {
            await supabase.from('products').update({ order_index: currentIndex + direction }).eq('id', id);
            loadData();
        };

        // GESTION DU STOCK
        window.toggleStock = async function(id, currentStock) {
            await supabase.from('products').update({ in_stock: !currentStock }).eq('id', id);
            loadData();
        };

        window.loadData = async function() {
            const { data: cats } = await supabase.from('categories').select('*'); categories = cats || [];
            document.getElementById('prod-category').innerHTML = categories.map(c => `<option value="${c.id}">${c.name}</option>`).join('');

            const { data: products } = await supabase.from('products').select('*').order('order_index', { ascending: true }).order('created_at', { ascending: false });
            
            let htmlCarte = '';
            categories.forEach(c => {
                let prodsInCat = (products || []).filter(p => p.category_id === c.id);
                if(prodsInCat.length > 0) {
                    htmlCarte += `
                    <div class="mb-8">
                        <h2 class="text-xl font-black uppercase tracking-widest text-neon mb-4 border-b border-white/10 pb-2">${c.name}</h2>
                        <div class="bg-premium border border-white/5 rounded-xl overflow-hidden">
                            <table class="w-full text-left text-sm">
                                <thead class="bg-white/5 text-gray-500 text-[10px] uppercase tracking-widest border-b border-white/5">
                                    <tr><th class="p-4">Produit</th><th class="p-4">Prix</th><th class="p-4 text-center">Stock</th><th class="p-4 text-right">Actions</th></tr>
                                </thead>
                                <tbody class="divide-y divide-white/5">
                                    ${prodsInCat.map(p => {
                                        const stockClass = p.in_stock !== false ? 'bg-green-500/20 text-green-400 border-green-500/30' : 'bg-red-500/20 text-red-500 border-red-500/30';
                                        return `
                                        <tr class="hover:bg-white/5 transition ${p.in_stock === false ? 'opacity-50' : ''}">
                                            <td class="p-4 font-bold uppercase tracking-wide">${p.name}</td>
                                            <td class="p-4 font-bold">${p.price.toFixed(2)} €</td>
                                            <td class="p-4 text-center">
                                                <button onclick="toggleStock('${p.id}',${p.in_stock !== false})" class="border px-3 py-1 rounded text-[10px] font-bold uppercase tracking-widest transition ${stockClass}">
                                                    ${p.in_stock !== false ? 'EN STOCK' : 'RUPTURE'}
                                                </button>
                                            </td>
                                            <td class="p-4 text-right flex justify-end gap-3 items-center">
                                                <button onclick="moveProduct('${p.id}',${p.order_index || 0}, -1)" class="text-gray-500 hover:text-white font-bold">⬆️</button>
                                                <button onclick="moveProduct('${p.id}',${p.order_index || 0}, 1)" class="text-gray-500 hover:text-white font-bold">⬇️</button>
                                                <button onclick="deleteProduct('${p.id}')" class="text-gray-500 hover:text-red-500 text-xs font-bold uppercase tracking-widest transition ml-4">Supprimer</button>
                                            </td>
                                        </tr>
                                    `}).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>`;
                }
            });
            document.getElementById('list-products-container').innerHTML = htmlCarte || '<p class="text-gray-500">Aucun plat.</p>';

            const { data: orders } = await supabase.from('orders').select('*').order('created_at', { ascending: false });
            document.getElementById('list-orders').innerHTML = orders?.length ? orders.map(o => {
                let btn = o.status === 'en_preparation' ? `<button onclick="updateOrderStatus('${o.id}', 'prete')" class="border border-neon text-neon px-4 py-2 text-[10px] font-bold uppercase tracking-widest hover:bg-neon hover:text-white ml-4 transition">Prête</button>` : (o.status === 'prete' ? `<button onclick="updateOrderStatus('${o.id}', 'terminee')" class="bg-white text-dark px-4 py-2 text-[10px] font-bold uppercase tracking-widest hover:bg-gray-300 ml-4 transition">Terminée</button>` : '');
                let color = o.status === 'terminee' ? 'text-gray-600' : 'text-white';
                let plats = (o.items && o.items.length > 0) ? o.items.map(i=> `<span class="bg-white/5 border border-white/10 px-2 py-1 mr-1 text-[10px] uppercase tracking-widest text-gray-400">${i.name}</span>`).join('') : '<span class="text-gray-600 text-xs">Ancienne commande</span>';
                return `<tr class="hover:bg-white/5 transition"><td class="p-4"><div class="font-black ${color} mb-2 text-lg">#${o.id.substring(0,6).toUpperCase()}</div><div class="flex flex-wrap gap-1">${plats}</div></td><td class="p-4 font-bold">${o.total_price.toFixed(2)} €</td><td class="p-4 text-right"><span class="text-[10px] font-bold uppercase tracking-widest ${o.status==='terminee'?'text-gray-600':'text-neon'}">${o.status.replace('_',' ')}</span> ${btn}</td></tr>`;
            }).join('') : '<tr><td colspan="3" class="p-4 text-center text-gray-500">Aucune commande.</td></tr>';

            const { data: promos } = await supabase.from('promocodes').select('*');
            document.getElementById('list-promos').innerHTML = promos?.length ? promos.map(p => `
                <tr class="hover:bg-white/5 transition"><td class="p-4 font-black uppercase tracking-widest">${p.code}</td><td class="p-4 text-gray-400 text-xs uppercase tracking-widest">${p.discount_value} ${p.discount_type==='points'?'👑':(p.discount_type==='percent'?'%':'€')}</td><td class="p-4 text-sm">${p.current_uses} / ${p.max_uses||'∞'}</td><td class="p-4 text-right"><button onclick="deletePromo('${p.code}')" class="text-gray-500 hover:text-red-500 text-xs font-bold uppercase tracking-widest transition">Supprimer</button></td></tr>
            `).join('') : '<tr><td colspan="4" class="p-4 text-center text-gray-500">Aucun code.</td></tr>';
        };

        window.submitCategory = async function() {
            const name = document.getElementById('cat-name').value;
            if(!name) return;
            await supabase.from('categories').insert([{ name }]);
            toggleModal('modal-category', false); document.getElementById('cat-name').value = ''; loadData();
        };

        window.submitProduct = async function() {
            const name = document.getElementById('prod-name').value, price = parseFloat(document.getElementById('prod-price').value), prep_time = parseInt(document.getElementById('prod-time').value), category_id = document.getElementById('prod-category').value;
            if(!name || isNaN(price) || !category_id) return alert("Infos manquantes.");
            await supabase.from('products').insert([{ name, price, prep_time: isNaN(prep_time) ? 60 : prep_time, category_id, order_index: 0, in_stock: true }]);
            toggleModal('modal-product', false); document.getElementById('prod-name').value = ''; document.getElementById('prod-price').value = ''; loadData();
        };

        window.submitPromo = async function() {
            const code = document.getElementById('promo-code').value.toUpperCase(), type = document.getElementById('promo-type').value, val = parseFloat(document.getElementById('promo-value').value), max = parseInt(document.getElementById('promo-max').value);
            if(!code || isNaN(val)) return alert("Veuillez remplir le code et la valeur.");
            const { error } = await supabase.from('promocodes').insert([{ code: code, discount_type: type, discount_value: val, max_uses: isNaN(max) ? null : max }]);
            if (error) alert("Erreur: " + error.message);
            else { toggleModal('modal-promo', false); document.getElementById('promo-code').value = ''; loadData(); }
        };

        checkAuth();
    </script>
</body>
</html>
