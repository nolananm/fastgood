<script type="module">
        import { supabase } from './db.js';

        // --- NAVIGATION ONGLETS ---
        window.switchTab = function(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.getElementById(tabId).classList.remove('hidden');
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('bg-neon/10', 'text-neon');
                btn.classList.add('text-gray-400');
            });
            const activeBtn = document.getElementById('tab-' + tabId);
            activeBtn.classList.remove('text-gray-400');
            activeBtn.classList.add('bg-neon/10', 'text-neon');
        };

        // --- AUTHENTIFICATION ---
        window.loginStaff = async function() {
            const email = document.getElementById('staff-email').value;
            const password = document.getElementById('staff-password').value;
            const { error } = await supabase.auth.signInWithPassword({ email, password });
            if (error) {
                document.getElementById('auth-error').innerText = "Identifiants incorrects.";
                document.getElementById('auth-error').classList.remove('hidden');
            } else {
                window.location.reload(); 
            }
        };

        window.logout = async function() {
            await supabase.auth.signOut();
            window.location.reload();
        };

        async function checkAuthStatus() {
            const { data: { session } } = await supabase.auth.getSession();
            if (session) {
                document.getElementById('auth-screen').classList.add('hidden');
                document.getElementById('app-screen').classList.remove('hidden');
                loadStaffData();
                loadCategories();
            }
        }

        // --- MODALS ---
        window.toggleModal = function(modalId, show) {
            const modal = document.getElementById(modalId);
            if(show) modal.classList.remove('hidden');
            else modal.classList.add('hidden');
        };

        // --- CHARGEMENT ---
        window.loadStaffData = async function() {
            const { data: products } = await supabase.from('products').select('*, categories(name)').order('created_at', { ascending: false });
            document.getElementById('products-list').innerHTML = products?.length ? products.map(p => `
                <tr class="hover:bg-white/5 border-b border-white/5"><td class="p-4 font-bold">${p.image_url || ''} ${p.name} <span class="text-xs text-gray-500 font-normal block">${p.categories?.name || 'Sans catégorie'}</span></td><td class="p-4">${p.price.toFixed(2)} €</td><td class="p-4">${p.prep_time}s</td><td class="p-4"><span class="text-green-400 bg-green-400/10 px-2 py-1 rounded text-xs font-bold">En ligne</span></td></tr>
            `).join('') : '<tr><td colspan="4" class="p-4 text-center">Aucun produit.</td></tr>';

            const { data: orders } = await supabase.from('orders').select('*').order('created_at', { ascending: false });
            document.getElementById('orders-list').innerHTML = orders?.length ? orders.map(o => `
                <tr class="hover:bg-white/5 border-b border-white/5"><td class="p-4 font-bold text-neon">#${o.id.substring(0,6).toUpperCase()}</td><td class="p-4">${o.total_price.toFixed(2)} €</td><td class="p-4">${o.estimated_time}s</td><td class="p-4"><span class="text-yellow-400 bg-yellow-400/10 px-2 py-1 rounded text-xs font-bold">${o.status.toUpperCase()}</span></td></tr>
            `).join('') : '<tr><td colspan="4" class="p-4 text-center">Aucune commande.</td></tr>';

            const { data: promos } = await supabase.from('promocodes').select('*');
            document.getElementById('promo-list').innerHTML = promos?.length ? promos.map(p => `
                <tr class="hover:bg-white/5 border-b border-white/5"><td class="p-4 font-bold uppercase">${p.code}</td><td class="p-4 text-gray-400">${p.discount_type}</td><td class="p-4 text-neon font-bold">${p.discount_value}</td><td class="p-4">${p.current_uses} / ${p.max_uses || '∞'}</td></tr>
            `).join('') : '<tr><td colspan="4" class="p-4 text-center">Aucun code.</td></tr>';
        };

        // --- SOUMISSIONS AVEC GESTION DES ERREURS ---
        async function loadCategories() {
            const { data } = await supabase.from('categories').select('*');
            document.getElementById('prod-category').innerHTML = data && data.length > 0 
                ? data.map(c => `<option value="${c.id}">${c.name}</option>`).join('') 
                : '<option value="">Aucune catégorie disponible</option>';
        }

        window.submitCategory = async function() {
            const name = document.getElementById('cat-name').value;
            if(!name) return alert("Renseignez un nom de catégorie.");
            
            const { error } = await supabase.from('categories').insert([{ name }]);
            if (error) {
                alert("Erreur: " + error.message);
                return;
            }
            
            toggleModal('add-category-modal', false);
            document.getElementById('cat-name').value = '';
            loadCategories();
            alert("Catégorie créée !");
        };

        window.submitProduct = async function() {
            const name = document.getElementById('prod-name').value;
            const price = parseFloat(document.getElementById('prod-price').value);
            const prep_time = parseInt(document.getElementById('prod-time').value);
            const category_id = document.getElementById('prod-category').value;
            const image_url = document.getElementById('prod-image').value;

            if(!name || isNaN(price) || isNaN(prep_time)) return alert("Remplissez le nom, le prix et le temps.");
            if(!category_id) return alert("Vous devez d'abord créer une catégorie !");
            
            const { error } = await supabase.from('products').insert([{ name, price, prep_time, category_id, image_url }]);
            
            if (error) {
                alert("Erreur lors de la création : " + error.message);
                return;
            }

            toggleModal('add-product-modal', false);
            document.getElementById('prod-name').value = '';
            document.getElementById('prod-price').value = '';
            document.getElementById('prod-time').value = '';
            document.getElementById('prod-image').value = '';
            loadStaffData();
        };

        window.submitPromo = async function() {
            const code = document.getElementById('promo-code').value.toUpperCase();
            const discount_type = document.getElementById('promo-type').value;
            const discount_value = parseFloat(document.getElementById('promo-value').value);
            const max_uses = parseInt(document.getElementById('promo-max').value);

            if(!code || isNaN(discount_value)) return alert("Remplissez le code et la valeur.");

            const { error } = await supabase.from('promocodes').insert([{ code, discount_type, discount_value, max_uses: isNaN(max_uses) ? null : max_uses }]);
            if (error) {
                alert("Erreur: " + error.message);
                return;
            }

            toggleModal('add-promo-modal', false);
            document.getElementById('promo-code').value = '';
            document.getElementById('promo-value').value = '';
            document.getElementById('promo-max').value = '';
            loadStaffData();
        };

        checkAuthStatus();
    </script>
