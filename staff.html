<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FastGood - Staff</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { theme: { extend: { colors: { neon: '#FF0055', dark: '#0a0a0a', darker: '#050505' } } } }</script>
</head>
<body class="bg-dark text-white font-sans antialiased h-screen flex overflow-hidden">

    <!-- Auth -->
    <div id="auth-screen" class="fixed inset-0 bg-darker z-50 flex items-center justify-center">
        <div class="bg-dark border border-white/10 p-8 rounded-2xl w-full max-w-md text-center">
            <div class="text-3xl font-black mb-6">GESTION <span class="text-neon">STAFF</span></div>
            <div class="space-y-4">
                <input type="email" id="staff-email" placeholder="Email Admin" class="w-full bg-darker border border-white/20 rounded-lg px-4 py-3 outline-none">
                <input type="password" id="staff-password" placeholder="Mot de passe" class="w-full bg-darker border border-white/20 rounded-lg px-4 py-3 outline-none">
                <button onclick="loginStaff()" class="w-full bg-neon text-white font-black py-3 rounded-xl">CONNEXION</button>
            </div>
        </div>
    </div>

    <!-- Modals -->
    <div id="add-promo-modal" class="hidden fixed inset-0 bg-black/80 z-50 flex items-center justify-center">
        <div class="bg-darker border border-white/10 p-8 rounded-2xl w-full max-w-md relative">
            <button onclick="toggleModal('add-promo-modal', false)" class="absolute top-4 right-4 text-gray-400">X</button>
            <h2 class="text-2xl font-black mb-6">Nouveau Code PromoGood</h2>
            <div class="space-y-4">
                <input type="text" id="promo-code" placeholder="Code (Ex: GOOD10)" class="w-full uppercase bg-dark border border-white/20 rounded-lg px-4 py-2">
                <select id="promo-type" class="w-full bg-dark border border-white/20 rounded-lg px-4 py-2">
                    <option value="percent">Remise en Pourcentage (%)</option>
                    <option value="amount">Remise Fixe (€)</option>
                    <option value="points">Couronnes FidGood Offertes 👑</option>
                </select>
                <div class="flex gap-4">
                    <input type="number" step="0.10" id="promo-value" placeholder="Valeur" class="w-full bg-dark border border-white/20 rounded-lg px-4 py-2">
                    <input type="number" id="promo-max" placeholder="Utilisations Max" class="w-full bg-dark border border-white/20 rounded-lg px-4 py-2">
                </div>
                <button onclick="submitPromo()" class="w-full bg-neon text-white font-black py-3 rounded-xl">CRÉER LE CODE</button>
            </div>
        </div>
    </div>

    <!-- Interface -->
    <div id="app-screen" class="hidden flex-1 flex h-full">
        <aside class="w-64 bg-darker border-r border-white/10 flex flex-col">
            <div class="h-20 flex items-center px-6 border-b border-white/10 text-xl font-black">STAFF<span class="text-neon">GOOD</span></div>
            <nav class="flex-1 p-4 space-y-2">
                <button onclick="switchTab('sec-commandes')" id="tab-sec-commandes" class="w-full text-left px-4 py-3 bg-neon/10 text-neon rounded-xl font-bold tab-btn">Commandes Live</button>
                <button onclick="switchTab('sec-promo')" id="tab-sec-promo" class="w-full text-left px-4 py-3 text-gray-400 rounded-xl tab-btn">Codes PromoGood</button>
            </nav>
            <button onclick="logout()" class="p-4 text-red-500 font-bold border-t border-white/10 text-left">Verrouiller</button>
        </aside>

        <main class="flex-1 overflow-y-auto p-8 relative">
            <button onclick="loadStaffData()" class="absolute top-8 right-8 border border-white/20 px-4 py-2 rounded-full text-sm">Rafraîchir</button>

            <!-- SECTION COMMANDES -->
            <div id="sec-commandes" class="tab-content block">
                <h1 class="text-3xl font-black text-neon mb-6">Commandes en cuisine</h1>
                <div class="bg-darker border border-white/10 rounded-2xl overflow-hidden">
                    <table class="w-full text-left"><thead class="bg-white/5 border-b border-white/10 text-gray-400 text-sm"><tr><th class="p-4">Commande</th><th class="p-4">Total</th><th class="p-4">Statut</th></tr></thead><tbody id="orders-list"></tbody></table>
                </div>
            </div>

            <!-- SECTION PROMO -->
            <div id="sec-promo" class="tab-content hidden">
                <div class="flex justify-between items-center mb-6">
                    <h1 class="text-3xl font-black">Codes PromoGood</h1>
                    <button onclick="toggleModal('add-promo-modal', true)" class="bg-neon text-white px-4 py-2 rounded-full font-bold">+ Nouveau Code</button>
                </div>
                <div class="bg-darker border border-white/10 rounded-2xl overflow-hidden">
                    <table class="w-full text-left"><thead class="bg-white/5 border-b border-white/10 text-gray-400 text-sm"><tr><th class="p-4">Code</th><th class="p-4">Type</th><th class="p-4">Valeur</th><th class="p-4">Utilisations</th></tr></thead><tbody id="promo-list"></tbody></table>
                </div>
            </div>
        </main>
    </div>

    <script type="module">
        import { supabase } from './db.js';

        window.switchTab = function(id) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
            document.querySelectorAll('.tab-btn').forEach(b => { b.classList.remove('bg-neon/10', 'text-neon'); b.classList.add('text-gray-400'); });
            document.getElementById('tab-'+id).classList.add('bg-neon/10', 'text-neon');
        };

        window.loginStaff = async function() {
            const email = document.getElementById('staff-email').value;
            const password = document.getElementById('staff-password').value;
            await supabase.auth.signInWithPassword({ email, password });
            window.location.reload(); 
        };
        window.logout = async function() { await supabase.auth.signOut(); window.location.reload(); };
        window.toggleModal = function(id, show) { document.getElementById(id).classList.toggle('hidden', !show); };

        async function checkAuthStatus() {
            const { data: { session } } = await supabase.auth.getSession();
            if (session) {
                document.getElementById('auth-screen').classList.add('hidden');
                document.getElementById('app-screen').classList.remove('hidden');
                loadStaffData();
            }
        }

        window.updateOrderStatus = async function(id, status) {
            await supabase.from('orders').update({ status }).eq('id', id); loadStaffData();
        };

        window.loadStaffData = async function() {
            const { data: orders } = await supabase.from('orders').select('*').order('created_at', { ascending: false });
            document.getElementById('orders-list').innerHTML = orders?.length ? orders.map(o => {
                let btn = o.status === 'en_preparation' ? `<button onclick="updateOrderStatus('${o.id}', 'prete')" class="bg-yellow-500 text-dark px-2 py-1 rounded text-xs ml-2">✅ Prête</button>` : 
                          (o.status === 'prete' ? `<button onclick="updateOrderStatus('${o.id}', 'terminee')" class="bg-green-500 text-white px-2 py-1 rounded text-xs ml-2">🏁 Terminée</button>` : '');
                let color = o.status === 'terminee' ? 'text-gray-500' : 'text-neon';
                let plats = o.items ? o.items.map(i=>i.name).join(', ') : '';
                return `<tr class="border-b border-white/5 hover:bg-white/5"><td class="p-4"><div class="font-bold ${color}">#${o.id.substring(0,6).toUpperCase()}</div><div class="text-xs text-gray-400">${plats}</div></td><td class="p-4 font-bold">${o.total_price.toFixed(2)} €</td><td class="p-4 flex items-center"><span class="text-xs font-bold uppercase ${o.status==='terminee'?'text-gray-500':'text-white'}">${o.status.replace('_',' ')}</span> ${btn}</td></tr>`;
            }).join('') : '<tr><td colspan="3" class="p-4 text-center">Rien.</td></tr>';

            const { data: promos } = await supabase.from('promocodes').select('*');
            document.getElementById('promo-list').innerHTML = promos?.length ? promos.map(p => `<tr><td class="p-4 font-bold uppercase">${p.code}</td><td class="p-4">${p.discount_type==='points'?'Couronnes':p.discount_type}</td><td class="p-4 text-neon">${p.discount_value}</td><td class="p-4">${p.current_uses}</td></tr>`).join('') : '';
        };

        window.submitPromo = async function() {
            const code = document.getElementById('promo-code').value.toUpperCase();
            const discount_type = document.getElementById('promo-type').value;
            const discount_value = parseFloat(document.getElementById('promo-value').value);
            if(!code || isNaN(discount_value)) return;
            await supabase.from('promocodes').insert([{ code, discount_type, discount_value }]);
            toggleModal('add-promo-modal', false); loadStaffData();
        };

        checkAuthStatus();
    </script>
</body>
</html>
