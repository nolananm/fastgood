<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FastGood - Mode Gestion (Staff)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { neon: '#FF0055', dark: '#0a0a0a', darker: '#050505' } } } }
    </script>
</head>
<body class="bg-dark text-white font-sans antialiased h-screen flex overflow-hidden relative">

    <!-- ECRAN 1 : VERROUILLAGE / LOGIN STAFF -->
    <div id="auth-screen" class="absolute inset-0 bg-darker z-50 flex items-center justify-center">
        <div class="bg-dark border border-white/10 p-8 rounded-2xl w-full max-w-md">
            <div class="text-3xl font-black mb-6 text-center">GESTION <span class="text-neon">STAFF</span></div>
            <div class="space-y-4">
                <input type="email" id="staff-email" placeholder="Email Admin" class="w-full bg-darker border border-white/20 rounded-lg px-4 py-3 focus:border-neon outline-none">
                <input type="password" id="staff-password" placeholder="Mot de passe" class="w-full bg-darker border border-white/20 rounded-lg px-4 py-3 focus:border-neon outline-none">
                <button onclick="loginStaff()" class="w-full bg-neon text-white font-black py-3 rounded-xl hover:bg-white hover:text-neon transition">CONNEXION</button>
                <p id="auth-error" class="text-red-500 text-sm text-center hidden"></p>
            </div>
        </div>
    </div>

    <!-- MODAL : AJOUTER UN PRODUIT -->
    <div id="add-product-modal" class="hidden absolute inset-0 bg-black/80 backdrop-blur-sm z-40 flex items-center justify-center">
        <div class="bg-darker border border-white/10 p-8 rounded-2xl w-full max-w-md relative">
            <button onclick="toggleModal(false)" class="absolute top-4 right-4 text-gray-400 hover:text-white font-bold text-xl">X</button>
            <h2 class="text-2xl font-black mb-6">Nouveau Plat</h2>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-bold mb-1">Nom du produit</label>
                    <input type="text" id="prod-name" placeholder="Ex: Maxi Cheese" class="w-full bg-dark border border-white/20 rounded-lg px-4 py-2 outline-none">
                </div>
                <div class="flex gap-4">
                    <div class="flex-1">
                        <label class="block text-sm font-bold mb-1">Prix (€)</label>
                        <input type="number" step="0.10" id="prod-price" placeholder="8.50" class="w-full bg-dark border border-white/20 rounded-lg px-4 py-2 outline-none">
                    </div>
                    <div class="flex-1">
                        <label class="block text-sm font-bold mb-1">Temps (sec)</label>
                        <input type="number" id="prod-time" placeholder="45" class="w-full bg-dark border border-white/20 rounded-lg px-4 py-2 outline-none">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-bold mb-1">Catégorie</label>
                    <select id="prod-category" class="w-full bg-dark border border-white/20 rounded-lg px-4 py-2 outline-none appearance-none">
                        <!-- Rempli par JS -->
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-bold mb-1">Emoji (Image)</label>
                    <input type="text" id="prod-emoji" placeholder="🍔" class="w-full bg-dark border border-white/20 rounded-lg px-4 py-2 outline-none">
                </div>
                <button onclick="submitProduct()" id="btn-submit-prod" class="w-full bg-white text-dark font-black py-3 rounded-xl mt-4 hover:bg-neon hover:text-white transition">CRÉER LE PLAT</button>
            </div>
        </div>
    </div>

    <!-- ECRAN 2 : APPLICATION STAFF -->
    <div id="app-screen" class="hidden flex-1 flex h-full">
        <!-- Sidebar Admin -->
        <aside class="w-64 bg-darker border-r border-white/10 flex flex-col">
            <div class="h-20 flex items-center px-6 border-b border-white/10 justify-between">
                <span class="text-xl font-black text-white">STAFF<span class="text-neon">GOOD</span></span>
            </div>
            <nav class="flex-1 p-4 space-y-2">
                <a href="#" class="block px-4 py-3 bg-neon/10 text-neon rounded-xl font-bold">🍔 Gestion Carte</a>
                <a href="#" class="block px-4 py-3 text-gray-400 hover:text-white hover:bg-white/5 rounded-xl transition">👨‍🍳 Commandes</a>
            </nav>
            <div class="p-4 border-t border-white/10">
                <button onclick="logout()" class="w-full text-left px-4 py-2 text-sm text-red-500 hover:text-white font-bold">Verrouiller</button>
            </div>
        </aside>

        <!-- Contenu principal -->
        <main class="flex-1 overflow-y-auto p-8 space-y-12">
            
            <!-- Section Commandes Live -->
            <div>
                <div class="flex justify-between items-center mb-6">
                    <h1 class="text-3xl font-black text-neon">Commandes en cuisine</h1>
                    <button onclick="loadStaffData()" class="border border-white/20 px-4 py-2 rounded-full text-sm hover:bg-white/10 transition flex items-center gap-2">
                        🔄 Rafraîchir
                    </button>
                </div>
                <div class="bg-darker border border-white/10 rounded-2xl overflow-hidden">
                    <table class="w-full text-left">
                        <thead class="bg-white/5 border-b border-white/10 text-gray-400 text-sm">
                            <tr>
                                <th class="p-4">N° Commande (ID)</th>
                                <th class="p-4">Total</th>
                                <th class="p-4">Temps Estimé</th>
                                <th class="p-4">Statut</th>
                            </tr>
                        </thead>
                        <tbody id="orders-list" class="divide-y divide-white/10">
                            <tr><td colspan="4" class="p-4 text-center text-gray-500">Chargement des commandes...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Section Carte et Produits -->
            <div>
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-2xl font-black">Carte Actuelle</h2>
                    <button onclick="toggleModal(true)" class="bg-white text-dark px-4 py-2 rounded-full font-bold hover:bg-gray-200 transition">+ Nouveau Plat</button>
                </div>
                <div class="bg-darker border border-white/10 rounded-2xl overflow-hidden">
                    <table class="w-full text-left">
                        <thead class="bg-white/5 border-b border-white/10 text-gray-400 text-sm">
                            <tr>
                                <th class="p-4">Produit</th>
                                <th class="p-4">Prix</th>
                                <th class="p-4">Temps de prépa</th>
                                <th class="p-4">Statut</th>
                            </tr>
                        </thead>
                        <tbody id="products-list" class="divide-y divide-white/10">
                            <tr><td colspan="4" class="p-4 text-center text-gray-500">Chargement des produits...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </main>
    </div>

    <!-- Script Application Staff -->
    <script type="module">
        import { supabase } from './db.js';

        let categories = [];

        // 1. Authentification Staff
        window.loginStaff = async function() {
            const email = document.getElementById('staff-email').value;
            const password = document.getElementById('staff-password').value;
            const errorEl = document.getElementById('auth-error');

            const { data, error } = await supabase.auth.signInWithPassword({ email, password });
            
            if (error) {
                errorEl.innerText = "Identifiants incorrects.";
                errorEl.classList.remove('hidden');
                return;
            }

            const { data: profile } = await supabase.from('profiles').select('role').eq('id', data.user.id).single();
            if (profile.role !== 'staff') {
                await supabase.auth.signOut();
                errorEl.innerText = "Accès refusé. Compte non autorisé.";
                errorEl.classList.remove('hidden');
                return;
            }

            checkAuthStatus();
        };

        window.logout = async function() {
            await supabase.auth.signOut();
            window.location.reload();
        };

        async function checkAuthStatus() {
            const { data: { session } } = await supabase.auth.getSession();
            if (session) {
                document.getElementById('auth-screen').classList.add('hidden');
                document.getElementById('app-screen').classList.remove('hidden');
                loadCategories();
                loadStaffData();
            } else {
                document.getElementById('auth-screen').classList.remove('hidden');
                document.getElementById('app-screen').classList.add('hidden');
            }
        }

        // 2. Charger les données (Produits & Commandes)
        window.loadStaffData = async function() {
            // Produits
            const { data: products } = await supabase.from('products').select('*').order('created_at', { ascending: false });
            const pList = document.getElementById('products-list');
            
            if (products && products.length > 0) {
                pList.innerHTML = products.map(p => `
                    <tr class="hover:bg-white/5 transition">
                        <td class="p-4 font-bold flex items-center gap-3"><span class="text-2xl">${p.image_url}</span> ${p.name}</td>
                        <td class="p-4">${p.price.toFixed(2)} €</td>
                        <td class="p-4">${p.prep_time} sec</td>
                        <td class="p-4"><span class="text-green-400 text-xs font-bold bg-green-400/10 px-2 py-1 rounded">En ligne</span></td>
                    </tr>
                `).join('');
            } else {
                pList.innerHTML = '<tr><td colspan="4" class="p-4 text-center text-gray-500">Aucun produit.</td></tr>';
            }

            // Commandes
            const { data: orders } = await supabase.from('orders').select('*').order('created_at', { ascending: false });
            const oList = document.getElementById('orders-list');

            if (orders && orders.length > 0) {
                oList.innerHTML = orders.map(o => `
                    <tr class="hover:bg-white/5 transition">
                        <td class="p-4 font-bold text-neon">#${o.id.substring(0,6).toUpperCase()}</td>
                        <td class="p-4">${o.total_price.toFixed(2)} €</td>
                        <td class="p-4">${o.estimated_time} sec</td>
                        <td class="p-4">
                            <span class="text-yellow-400 text-xs font-bold bg-yellow-400/10 px-2 py-1 rounded border border-yellow-400/20">${o.status.toUpperCase()}</span>
                        </td>
                    </tr>
                `).join('');
            } else {
                oList.innerHTML = '<tr><td colspan="4" class="p-4 text-center text-gray-500">Aucune commande.</td></tr>';
            }
        };

        // 3. Gestion Création de produit
        async function loadCategories() {
            const { data } = await supabase.from('categories').select('*');
            categories = data || [];
            const select = document.getElementById('prod-category');
            select.innerHTML = categories.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
        }

        window.toggleModal = function(show) {
            const modal = document.getElementById('add-product-modal');
            if(show) {
                modal.classList.remove('hidden');
            } else {
                modal.classList.add('hidden');
                // Reset form
                document.getElementById('prod-name').value = '';
                document.getElementById('prod-price').value = '';
                document.getElementById('prod-time').value = '';
                document.getElementById('prod-emoji').value = '';
            }
        };

        window.submitProduct = async function() {
            const name = document.getElementById('prod-name').value;
            const price = parseFloat(document.getElementById('prod-price').value);
            const prep_time = parseInt(document.getElementById('prod-time').value);
            const category_id = document.getElementById('prod-category').value;
            const image_url = document.getElementById('prod-emoji').value;
            const btn = document.getElementById('btn-submit-prod');

            if(!name || isNaN(price) || isNaN(prep_time) || !image_url) {
                alert("Veuillez remplir tous les champs correctement.");
                return;
            }

            btn.innerText = "CRÉATION...";
            btn.disabled = true;

            const { error } = await supabase.from('products').insert([{
                name, price, prep_time, category_id, image_url
            }]);

            btn.innerText = "CRÉER LE PLAT";
            btn.disabled = false;

            if (error) {
                alert("Erreur lors de la création.");
                console.error(error);
            } else {
                toggleModal(false);
                loadStaffData(); // Rafraîchit la liste automatiquement
            }
        };

        // Démarrage
        checkAuthStatus();
    </script>
</body>
</html>
