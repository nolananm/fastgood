<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FastGood - Staff</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { theme: { extend: { colors: { neon: '#FF0055', dark: '#0a0a0a', darker: '#050505' } } } }</script>
</head>
<body class="bg-dark text-white font-sans antialiased h-screen flex overflow-hidden">

    <!-- ECRAN 1 : CONNEXION -->
    <div id="auth-screen" class="fixed inset-0 bg-darker z-50 flex items-center justify-center">
        <div class="bg-dark border border-white/10 p-8 rounded-2xl w-full max-w-md text-center">
            <div class="text-3xl font-black mb-6">GESTION <span class="text-neon">STAFF</span></div>
            <div class="space-y-4">
                <input type="email" id="staff-email" placeholder="Email Admin" class="w-full bg-darker border border-white/20 rounded-lg px-4 py-3 outline-none">
                <input type="password" id="staff-password" placeholder="Mot de passe" class="w-full bg-darker border border-white/20 rounded-lg px-4 py-3 outline-none">
                <button onclick="loginStaff()" class="w-full bg-neon text-white font-black py-3 rounded-xl hover:bg-white hover:text-dark transition">CONNEXION</button>
                <p id="auth-error" class="text-red-500 text-sm hidden"></p>
            </div>
        </div>
    </div>

    <!-- MODALS -->
    <div id="modal-category" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center">
        <div class="bg-darker border border-white/10 p-8 rounded-2xl w-full max-w-md relative">
            <button onclick="toggleModal('modal-category', false)" class="absolute top-4 right-4 text-gray-400 font-bold text-xl hover:text-white">X</button>
            <h2 class="text-2xl font-black mb-6">Nouvelle Catégorie</h2>
            <input type="text" id="cat-name" placeholder="Nom (Ex: Burgers)" class="w-full bg-dark border border-white/20 rounded-lg px-4 py-3 mb-4 outline-none">
            <button onclick="submitCategory()" class="w-full bg-white text-dark font-black py-3 rounded-xl hover:bg-neon hover:text-white transition">CRÉER</button>
        </div>
    </div>

    <div id="modal-product" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center">
        <div class="bg-darker border border-white/10 p-8 rounded-2xl w-full max-w-md relative">
            <button onclick="toggleModal('modal-product', false)" class="absolute top-4 right-4 text-gray-400 font-bold text-xl hover:text-white">X</button>
            <h2 class="text-2xl font-black mb-6">Nouveau Plat</h2>
            <div class="space-y-4">
                <input type="text" id="prod-name" placeholder="Nom du plat" class="w-full bg-dark border border-white/20 rounded-lg px-4 py-2 outline-none">
                <div class="flex gap-4">
                    <input type="number" step="0.10" id="prod-price" placeholder="Prix (€)" class="w-full bg-dark border border-white/20 rounded-lg px-4 py-2 outline-none">
                    <input type="number" id="prod-time" placeholder="Temps (sec)" class="w-full bg-dark border border-white/20 rounded-lg px-4 py-2 outline-none">
                </div>
                <select id="prod-category" class="w-full bg-dark border border-white/20 rounded-lg px-4 py-2 outline-none"></select>
                <input type="text" id="prod-image" placeholder="Image (Lien URL HD)" class="w-full bg-dark border border-white/20 rounded-lg px-4 py-2 outline-none">
                <button onclick="submitProduct()" class="w-full bg-neon text-white font-black py-3 rounded-xl hover:bg-white hover:text-dark transition">CRÉER LE PLAT</button>
            </div>
        </div>
    </div>

    <div id="modal-promo" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center">
        <div class="bg-darker border border-white/10 p-8 rounded-2xl w-full max-w-md relative">
            <button onclick="toggleModal('modal-promo', false)" class="absolute top-4 right-4 text-gray-400 font-bold text-xl hover:text-white">X</button>
            <h2 class="text-2xl font-black mb-6">Code PromoGood</h2>
            <div class="space-y-4">
                <input type="text" id="promo-code" placeholder="Code (Ex: GOOD10)" class="w-full uppercase bg-dark border border-white/20 rounded-lg px-4 py-2 outline-none">
                <select id="promo-type" class="w-full bg-dark border border-white/20 rounded-lg px-4 py-2 outline-none">
                    <option value="percent">Remise (%)</option>
                    <option value="amount">Remise Fixe (€)</option>
                    <option value="points">Couronnes 👑</option>
                </select>
                <div class="flex gap-4">
                    <input type="number" step="0.10" id="promo-value" placeholder="Valeur" class="w-full bg-dark border border-white/20 rounded-lg px-4 py-2 outline-none">
                    <input type="number" id="promo-max" placeholder="Utilisations Max" class="w-full bg-dark border border-white/20 rounded-lg px-4 py-2 outline-none">
                </div>
                <button onclick="submitPromo()" class="w-full bg-neon text-white font-black py-3 rounded-xl hover:bg-white hover:text-dark transition">CRÉER LE CODE</button>
            </div>
        </div>
    </div>

    <!-- ECRAN 2 : APPLICATION -->
    <div id="app-screen" class="hidden flex-1 flex h-full">
        <!-- Sidebar -->
        <aside class="w-64 bg-darker border-r border-white/10 flex flex-col">
            <div class="h-20 flex items-center px-6 border-b border-white/10 text-xl font-black">STAFF<span class="text-neon">GOOD</span></div>
            <nav class="flex-1 p-4 space-y-2">
                <button onclick="switchTab('sec-carte')" id="tab-sec-carte" class="w-full text-left px-4 py-3 bg-neon/10 text-neon rounded-xl font-bold tab-btn transition">🍔 Gestion Carte</button>
                <button onclick="switchTab('sec-commandes')" id="tab-sec-commandes" class="w-full text-left px-4 py-3 text-gray-400 hover:text-white hover:bg-white/5 rounded-xl tab-btn transition">👨‍🍳 Commandes Live</button>
                <button onclick="switchTab('sec-promo')" id="tab-sec-promo" class="w-full text-left px-4 py-3 text-gray-400 hover:text-white hover:bg-white/5 rounded-xl tab-btn transition">🎟️ Codes PromoGood</button>
            </nav>
            <button onclick="logout()" class="p-4 text-red-500 font-bold border-t border-white/10 text-left hover:text-white transition">Verrouiller</button>
        </aside>

        <!-- Contenu -->
        <main class="flex-1 overflow-y-auto p-8 relative">
            <button onclick="loadData()" class="absolute top-8 right-8 border border-white/20 px-4 py-2 rounded-full text-sm hover:bg-white/10 transition">🔄 Rafraîchir</button>

            <!-- ONGLET CARTE -->
            <div id="sec-carte" class="tab-content block">
                <div class="flex justify-between items-center mb-6">
                    <h1 class="text-3xl font-black">Carte Actuelle</h1>
                    <div class="flex gap-4">
                        <button onclick="toggleModal('modal-category', true)" class="border border-white/20 text-white px-4 py-2 rounded-full font-bold hover:bg-white/10 transition">+ Catégorie</button>
                        <button onclick="toggleModal('modal-product', true)" class="bg-white text-dark px-4 py-2 rounded-full font-bold hover:bg-gray-200 transition">+ Nouveau Plat</button>
                    </div>
                </div>
                <div class="bg-darker border border-white/10 rounded-2xl overflow-hidden">
                    <table class="w-full text-left"><thead class="bg-white/5 border-b border-white/10 text-gray-400 text-sm"><tr><th class="p-4">Produit</th><th class="p-4">Prix</th><th class="p-4">Temps</th><th class="p-4">Actions</th></tr></thead><tbody id="list-products" class="divide-y divide-white/10"></tbody></table>
                </div>
            </div>

            <!-- ONGLET COMMANDES -->
            <div id="sec-commandes" class="tab-content hidden">
                <h1 class="text-3xl font-black text-neon mb-6">Commandes en cuisine</h1>
                <div class="bg-darker border border-white/10 rounded-2xl overflow-hidden">
                    <table class="w-full text-left"><thead class="bg-white/5 border-b border-white/10 text-gray-400 text-sm"><tr><th class="p-4">Commande</th><th class="p-4">Total</th><th class="p-4">Statut / Actions</th></tr></thead><tbody id="list-orders" class="divide-y divide-white/10"></tbody></table>
                </div>
            </div>

            <!-- ONGLET PROMOS -->
            <div id="sec-promo" class="tab-content hidden">
                <div class="flex justify-between items-center mb-6">
                    <h1 class="text-3xl font-black">Codes PromoGood</h1>
                    <button onclick="toggleModal('modal-promo', true)" class="bg-neon text-white px-4 py-2 rounded-full font-bold hover:bg-white hover:text-dark transition">+ Nouveau Code</button>
                </div>
                <div class="bg-darker border border-white/10 rounded-2xl overflow-hidden">
                    <table class="w-full text-left"><thead class="bg-white/5 border-b border-white/10 text-gray-400 text-sm"><tr><th class="p-4">Code</th><th class="p-4">Type</th><th class="p-4">Valeur</th><th class="p-4">Utilisations</th></tr></thead><tbody id="list-promos" class="divide-y divide-white/10"></tbody></table>
                </div>
            </div>
        </main>
    </div>

    <!-- SCRIPT -->
    <script type="module">
        import { supabase } from './db.js';

        let categoriesMap = {}; 

        window.switchTab = function(id) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
            document.querySelectorAll('.tab-btn').forEach(b => { b.classList.remove('bg-neon/10', 'text-neon'); b.classList.add('text-gray-400'); });
            document.getElementById('tab-'+id).classList.add('bg-neon/10', 'text-neon');
        };

        window.toggleModal = function(id, show) { document.getElementById(id).classList.toggle('hidden', !show); };

        window.loginStaff = async function() {
            const email = document.getElementById('staff-email').value;
            const password = document.getElementById('staff-password').value;
            const { error } = await supabase.auth.signInWithPassword({ email, password });
            if (error) { document.getElementById('auth-error').innerText = "Identifiants incorrects."; document.getElementById('auth-error').classList.remove('hidden'); } 
            else { window.location.reload(); }
        };
        window.logout = async function() { await supabase.auth.signOut(); window.location.reload(); };

        async function checkAuth() {
            const { data: { session } } = await supabase.auth.getSession();
            if (session) {
                document.getElementById('auth-screen').classList.add('hidden');
                document.getElementById('app-screen').classList.remove('hidden');
                await loadCategoriesDropdown();
                loadData();
            }
        }

        window.updateOrderStatus = async function(id, status) { await supabase.from('orders').update({ status }).eq('id', id); loadData(); };
        window.deleteProduct = async function(id) { if(confirm('Supprimer ce plat ?')) { await supabase.from('products').delete().eq('id', id); loadData(); } };

        window.loadData = async function() {
            // Produits
            const { data: products, error: prodErr } = await supabase.from('products').select('*').order('created_at', { ascending: false });
            if(prodErr) console.error("Erreur plats:", prodErr);
            
            document.getElementById('list-products').innerHTML = products?.length ? products.map(p => `
                <tr class="hover:bg-white/5"><td class="p-4 font-bold">${p.image_url ? `<img src="${p.image_url}" class="inline-block w-8 h-8 object-cover rounded-full mr-2">` : ''} ${p.name} <span class="block text-xs text-gray-500 font-normal">${categoriesMap[p.category_id] || 'Sans catégorie'}</span></td><td class="p-4">${p.price.toFixed(2)} €</td><td class="p-4">${p.prep_time}s</td><td class="p-4"><button onclick="deleteProduct('${p.id}')" class="text-red-500 text-xs font-bold hover:text-white border border-red-500/50 px-2 py-1 rounded">Supprimer</button></td></tr>
            `).join('') : '<tr><td colspan="4" class="p-4 text-center">Aucun plat.</td></tr>';

            // Commandes
            const { data: orders } = await supabase.from('orders').select('*').order('created_at', { ascending: false });
            document.getElementById('list-orders').innerHTML = orders?.length ? orders.map(o => {
                let btn = o.status === 'en_preparation' ? `<button onclick="updateOrderStatus('${o.id}', 'prete')" class="bg-yellow-500 text-dark px-3 py-1 rounded-full text-xs font-bold hover:bg-white ml-3 transition">✅ Prête</button>` : 
                          (o.status === 'prete' ? `<button onclick="updateOrderStatus('${o.id}', 'terminee')" class="bg-green-500 text-white px-3 py-1 rounded-full text-xs font-bold hover:bg-white hover:text-dark ml-3 transition">🏁 Terminée</button>` : '');
                let color = o.status === 'terminee' ? 'text-gray-500' : 'text-neon';
                let plats = (o.items && o.items.length > 0) ? o.items.map(i=> `<span class="bg-white/10 px-2 py-1 rounded mr-1">${i.name}</span>`).join('') : '<span class="text-gray-600">Aucun détail</span>';
                
                return `<tr class="hover:bg-white/5"><td class="p-4"><div class="font-bold ${color} mb-2">#${o.id.substring(0,6).toUpperCase()}</div><div class="text-xs text-gray-300 flex flex-wrap gap-1">${plats}</div></td><td class="p-4 font-bold">${o.total_price.toFixed(2)} €</td><td class="p-4 flex items-center"><span class="text-xs font-bold uppercase ${o.status==='terminee'?'text-gray-500':'text-white'}">${o.status.replace('_',' ')}</span>${btn}</td></tr>`;
            }).join('') : '<tr><td colspan="3" class="p-4 text-center">Aucune commande.</td></tr>';

            // Promos
            const { data: promos } = await supabase.from('promocodes').select('*');
            document.getElementById('list-promos').innerHTML = promos?.length ? promos.map(p => `
                <tr class="hover:bg-white/5"><td class="p-4 font-bold uppercase">${p.code}</td><td class="p-4 text-gray-400">${p.discount_type==='points'?'Couronnes':p.discount_type}</td><td class="p-4 text-neon font-bold">${p.discount_value}</td><td class="p-4">${p.current_uses} /${p.max_uses||'∞'}</td></tr>
            `).join('') : '<tr><td colspan="4" class="p-4 text-center">Aucun code.</td></tr>';
        };

        // Soumissions
        async function loadCategoriesDropdown() {
            const { data } = await supabase.from('categories').select('*');
            if(data) {
                data.forEach(c => categoriesMap[c.id] = c.name);
                document.getElementById('prod-category').innerHTML = data.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
            } else {
                document.getElementById('prod-category').innerHTML = '<option value="">Créer une catégorie d\'abord</option>';
            }
        }

        window.submitCategory = async function() {
            const name = document.getElementById('cat-name').value;
            if(!name) return;
            const { error } = await supabase.from('categories').insert([{ name }]);
            if(error) { alert("Erreur Catégorie : " + error.message); return; }
            toggleModal('modal-category', false); document.getElementById('cat-name').value = ''; loadCategoriesDropdown();
        };

        window.submitProduct = async function() {
            const name = document.getElementById('prod-name').value;
            const price = parseFloat(document.getElementById('prod-price').value);
            const prep_time = parseInt(document.getElementById('prod-time').value);
            const category_id = document.getElementById('prod-category').value;
            const image_url = document.getElementById('prod-image').value;
            if(!name || isNaN(price) || !category_id) return alert("Infos manquantes.");
            
            const { error } = await supabase.from('products').insert([{ name, price, prep_time: isNaN(prep_time) ? 60 : prep_time, category_id, image_url }]);
            if(error) { alert("Erreur Création Plat : " + error.message); return; }
            
            toggleModal('modal-product', false);
            document.getElementById('prod-name').value = ''; document.getElementById('prod-price').value = ''; document.getElementById('prod-image').value = '';
            loadData();
        };

        window.submitPromo = async function() {
            const code = document.getElementById('promo-code').value.toUpperCase();
            const discount_type = document.getElementById('promo-type').value;
            const discount_value = parseFloat(document.getElementById('promo-value').value);
            const max_uses = parseInt(document.getElementById('promo-max').value);
            if(!code || isNaN(discount_value)) return alert("Code ou valeur manquante");
            
            const { error } = await supabase.from('promocodes').insert([{ code, discount_type, discount_value, max_uses: isNaN(max_uses) ? null : max_uses }]);
            if(error) { alert("Erreur Création Promo : " + error.message); return; }

            toggleModal('modal-promo', false); document.getElementById('promo-code').value = '';
            loadData();
        };

        checkAuth();
    </script>
</body>
</html>
