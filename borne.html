<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Borne - FastGood</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: { extend: { colors: { neon: '#FF0055', dark: '#0a0a0a', darker: '#050505' } } }
        }
    </script>
</head>
<body class="bg-dark text-white font-sans antialiased h-screen flex flex-col overflow-hidden">

    <!-- En-tête Borne -->
    <header class="bg-darker border-b border-white/10 p-4 flex justify-between items-center">
        <div class="text-xl font-black">FAST<span class="text-neon">GOOD</span> <span class="text-gray-500 text-sm ml-2">CAISSE 01 - MONTPELLIER</span></div>
        <div class="flex items-center gap-4">
            <span class="text-gray-400 text-sm">Temps file actuel : <span class="text-yellow-400 font-bold">~ 2m 30s</span></span>
        </div>
    </header>

    <div class="flex flex-1 overflow-hidden">
        
        <!-- Prise de commande (Catalogue simple) -->
        <div class="flex-1 p-4 overflow-y-auto bg-dark border-r border-white/10">
            <!-- Saisie Numéro Client -->
            <div class="bg-darker p-4 rounded-xl border border-white/20 mb-6 flex gap-4">
                <input type="text" placeholder="N° Client (6 chiffres) ou Code PromoGood" class="bg-dark border border-white/10 rounded-lg px-4 py-3 flex-1 text-lg uppercase focus:border-neon outline-none">
                <button class="bg-white text-dark px-6 py-3 rounded-lg font-bold">Valider</button>
            </div>

            <!-- Filtres rapides -->
            <div class="flex gap-2 mb-4 overflow-x-auto pb-2">
                <button class="bg-neon text-white px-6 py-3 rounded-lg font-bold whitespace-nowrap">Menus</button>
                <button class="bg-darker border border-white/10 px-6 py-3 rounded-lg font-bold text-gray-300 whitespace-nowrap">Burgers (25s)</button>
                <button class="bg-darker border border-white/10 px-6 py-3 rounded-lg font-bold text-gray-300 whitespace-nowrap">Boissons (5s)</button>
                <button class="bg-darker border border-white/10 px-6 py-3 rounded-lg font-bold text-gray-300 whitespace-nowrap">Snacks (10s)</button>
            </div>

            <!-- Grille Produits (Gros boutons) -->
            <div class="grid grid-cols-2 md:grid-cols-3 gap-4">
                <button class="bg-darker border border-white/10 p-4 rounded-xl text-left hover:border-neon active:bg-neon/20 h-32 flex flex-col justify-between">
                    <span class="font-bold text-lg leading-tight">Menu Smash</span>
                    <span class="text-neon font-black">12.90 €</span>
                </button>
                <button class="bg-darker border border-white/10 p-4 rounded-xl text-left hover:border-neon active:bg-neon/20 h-32 flex flex-col justify-between">
                    <span class="font-bold text-lg leading-tight">Menu Chicken</span>
                    <span class="text-neon font-black">11.50 €</span>
                </button>
                <button class="bg-darker border border-white/10 p-4 rounded-xl text-left hover:border-neon active:bg-neon/20 h-32 flex flex-col justify-between">
                    <span class="font-bold text-lg leading-tight">Frites Cheddar</span>
                    <span class="text-neon font-black">4.50 €</span>
                </button>
                 <button class="bg-darker border border-red-500/30 p-4 rounded-xl text-left opacity-50 cursor-not-allowed h-32 flex flex-col justify-between">
                    <span class="font-bold text-lg text-gray-400 leading-tight line-through">Milkshake Vanille</span>
                    <span class="text-red-500 font-bold text-sm">RUPTURE</span>
                </button>
            </div>
        </div>

        <!-- Ticket de caisse / Récapitulatif à droite -->
        <div class="w-96 bg-darker flex flex-col">
            <div class="p-4 border-b border-white/10">
                <h2 class="font-black text-xl mb-1">Commande en cours</h2>
                <div class="text-sm text-green-400 bg-green-400/10 inline-block px-2 py-1 rounded">Client N° 482910 détecté (FidGood Actif)</div>
            </div>
            
            <div class="flex-1 p-4 overflow-y-auto space-y-4">
                <!-- Item -->
                <div class="flex justify-between items-center">
                    <div>
                        <div class="font-bold">1x Menu Smash</div>
                        <div class="text-xs text-gray-500">+ Temps prépa : 45s</div>
                    </div>
                    <div class="font-bold">12.90 €</div>
                </div>
                <!-- Code Promo appliqué -->
                <div class="flex justify-between items-center text-neon">
                    <div>
                        <div class="font-bold text-sm">PROMO : -10% Étudiant</div>
                    </div>
                    <div class="font-bold">- 1.29 €</div>
                </div>
            </div>

            <!-- Bloc Paiement -->
            <div class="p-4 bg-dark border-t border-white/10">
                <div class="flex justify-between items-end mb-4">
                    <span class="text-gray-400 font-bold">Total TTC</span>
                    <span class="text-4xl font-black text-white">11.61 €</span>
                </div>
                
                <div class="grid grid-cols-2 gap-2 mb-4">
                    <button class="bg-white/10 py-4 rounded-xl font-bold hover:bg-white/20">💳 Carte</button>
                    <button class="bg-white/10 py-4 rounded-xl font-bold hover:bg-white/20">💵 Espèce</button>
                </div>
                
                <button class="w-full bg-neon text-white py-5 rounded-xl font-black text-xl hover:bg-white hover:text-neon transition">
                    ENCAISSER & ENVOYER
                </button>
                
                <div class="text-center mt-3 text-gray-500 text-sm">
                    Temps prépa estimé de cette commande : <strong class="text-white">45 sec</strong>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
