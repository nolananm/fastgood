<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Borne - FastGood</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { neon: '#FF0055', dark: '#0a0a0a', darker: '#050505' } } } }
    </script>
</head>
<body class="bg-dark text-white font-sans antialiased h-screen flex flex-col overflow-hidden relative">

    <!-- ECRAN 1 : VERROUILLAGE / LOGIN STAFF -->
    <div id="auth-screen" class="absolute inset-0 bg-darker z-50 flex items-center justify-center">
        <div class="bg-dark border border-white/10 p-8 rounded-2xl w-full max-w-md">
            <div class="text-3xl font-black mb-6 text-center">BORNE <span class="text-neon">STAFF</span></div>
            <div class="space-y-4">
                <input type="email" id="staff-email" placeholder="Email Staff" class="w-full bg-darker border border-white/20 rounded-lg px-4 py-3 focus:border-neon outline-none">
                <input type="password" id="staff-password" placeholder="Mot de passe" class="w-full bg-darker border border-white/20 rounded-lg px-4 py-3 focus:border-neon outline-none">
                <button onclick="loginStaff()" class="w-full bg-neon text-white font-black py-3 rounded-xl hover:bg-white hover:text-neon transition">DÉVERROUILLER</button>
                <p id="auth-error" class="text-red-500 text-sm text-center hidden"></p>
            </div>
        </div>
    </div>

    <!-- ECRAN 2 : CHOIX DU RESTAURANT -->
    <div id="setup-screen" class="hidden absolute inset-0 bg-darker z-40 flex items-center justify-center">
        <div class="bg-dark border border-white/10 p-8 rounded-2xl w-full max-w-md text-center">
            <h2 class="text-2xl font-black mb-6">Configuration de la borne</h2>
            <select id="restaurant-select" class="w-full bg-darker border border-white/20 rounded-lg px-4 py-3 mb-6 outline-none text-white appearance-none">
                <option value="">Chargement des restaurants...</option>
            </select>
            <button onclick="startBorne()" class="w-full bg-white text-dark font-black py-3 rounded-xl hover:bg-neon hover:text-white transition">LANCER LA CAISSE</button>
        </div>
    </div>

    <!-- ECRAN 3 : L'INTERFACE BORNE (Cachée par défaut) -->
    <div id="app-screen" class="hidden flex-1 flex flex-col h-full">
        <header class="bg-darker border-b border-white/10 p-4 flex justify-between items-center">
            <div class="text-xl font-black">FAST<span class="text-neon">GOOD</span></div>
            <div id="active-restaurant-name" class="text-gray-400 font-bold bg-white/5 px-4 py-1 rounded-full">...</div>
            <button onclick="logout()" class="text-red-500 text-sm font-bold hover:text-white">Verrouiller</button>
        </header>

        <div class="flex flex-1 overflow-hidden">
            <!-- Prise de commande -->
            <div class="flex-1 p-4 overflow-y-auto bg-dark border-r border-white/10">
                <div class="bg-darker p-4 rounded-xl border border-white/20 mb-6">
                    <div class="flex gap-4">
                        <input type="text" id="client-id-input" placeholder="N° Client (6 chiffres)" class="bg-dark border border-white/10 rounded-lg px-4 py-3 flex-1 text-lg uppercase focus:border-neon outline-none">
                        <button onclick="searchClient()" class="bg-white text-dark px-6 py-3 rounded-lg font-bold">Valider</button>
                    </div>
                    <div id="client-info"></div>
                </div>
                <h2 class="text-xl font-bold mb-4">Produits</h2>
                <div id="borne-menu-container" class="grid grid-cols-2 md:grid-cols-3 gap-4"></div>
            </div>

            <!-- Ticket de caisse -->
            <div class="w-96 bg-darker flex flex-col">
                <div class="p-4 border-b border-white/10"><h2 class="font-black text-xl mb-1">Commande en cours</h2></div>
                <div id="cart-container" class="flex-1 p-4 overflow-y-auto space-y-4"></div>
                <div class="p-4 bg-dark border-t border-white/10">
                    <div class="flex justify-between items-end mb-4">
                        <span class="text-gray-400 font-bold">Total TTC</span>
                        <span class="text-4xl font-black text-white" id="total-price">0.00 €</span>
                    </div>
                    <button id="btn-encaissement" class="w-full bg-neon text-white py-5 rounded-xl font-black text-xl">ENCAISSER & ENVOYER</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Script Borne Sécurisée -->
    <script type="module">
        import { supabase } from './db.js';

        let cart = [];
        let allProducts = [];
        let currentClient = null;
        let activeRestaurantId = null;

        // 1. Authentification Staff
        window.loginStaff = async function() {
            const email = document.getElementById('staff-email').value;
            const password = document.getElementById('staff-password').value;
            const errorEl = document.getElementById('auth-error');

            const { data, error } = await supabase.auth.signInWithPassword({ email, password });
            
            if (error) {
                errorEl.innerText = "Identifiants incorrects.";
                errorEl.classList.remove('hidden');
                return;
            }

            // Vérifier si le rôle est bien STAFF
            const { data: profile } = await supabase.from('profiles').select('role').eq('id', data.user.id).single();
            if (profile.role !== 'staff') {
                await supabase.auth.signOut();
                errorEl.innerText = "Accès refusé. Vous n'êtes pas Staff.";
                errorEl.classList.remove('hidden');
                return;
            }

            checkAuthStatus();
        };

        window.logout = async function() {
            await supabase.auth.signOut();
            window.location.reload();
        };

        // 2. Vérification de l'état de connexion
        async function checkAuthStatus() {
            const { data: { session } } = await supabase.auth.getSession();
            if (session) {
                document.getElementById('auth-screen').classList.add('hidden');
                loadRestaurants();
            } else {
                document.getElementById('auth-screen').classList.remove('hidden');
                document.getElementById('setup-screen').classList.add('hidden');
                document.getElementById('app-screen').classList.add('hidden');
            }
        }

        // 3. Charger les restaurants pour configuration
        async function loadRestaurants() {
            document.getElementById('setup-screen').classList.remove('hidden');
            const { data: restaurants } = await supabase.from('restaurants').select('*');
            const select = document.getElementById('restaurant-select');
            
            if(restaurants) {
                select.innerHTML = restaurants.map(r => `<option value="${r.id}">${r.name}</option>`).join('');
            }
        }

        // 4. Lancer la borne avec le restaurant choisi
        window.startBorne = function() {
            const select = document.getElementById('restaurant-select');
            activeRestaurantId = select.value;
            const restoName = select.options[select.selectedIndex].text;
            
            document.getElementById('setup-screen').classList.add('hidden');
            document.getElementById('app-screen').classList.remove('hidden');
            document.getElementById('active-restaurant-name').innerText = restoName.toUpperCase();
            
            loadBorneMenu();
        };

        // 5. Charger le menu (idem qu'avant)
        async function loadBorneMenu() {
            const { data: products } = await supabase.from('products').select('*');
            allProducts = products || [];
            document.getElementById('borne-menu-container').innerHTML = allProducts.map(p => `
                <button onclick="window.addToCart('${p.id}')" class="bg-darker border border-white/10 p-4 rounded-xl text-left hover:border-neon">
                    <span class="font-bold text-lg leading-tight flex items-center gap-2">${p.image_url} ${p.name}</span>
                    <span class="text-neon font-black">${p.price.toFixed(2)} €</span>
                </button>
            `).join('');
        }

        // 6. Gestion Client & Panier (idem)
        window.searchClient = async function() {
            const clientNum = document.getElementById('client-id-input').value;
            const { data } = await supabase.from('profiles').select('*').eq('client_number', clientNum).single();
            const infoDiv = document.getElementById('client-info');
            if (data) {
                currentClient = data;
                infoDiv.innerHTML = `<div class="text-sm text-green-400 bg-green-400/10 px-2 py-1 rounded mt-3 font-bold">✅ Client N° ${data.client_number} (${data.fidgood_points} pts)</div>`;
            } else {
                currentClient = null;
                infoDiv.innerHTML = `<div class="text-sm text-red-500 bg-red-500/10 px-2 py-1 rounded mt-3 font-bold">❌ Client introuvable</div>`;
            }
        };

        window.addToCart = function(id) { cart.push(allProducts.find(p => p.id === id)); updateCartUI(); };
        window.removeFromCart = function(index) { cart.splice(index, 1); updateCartUI(); };

        function updateCartUI() {
            const container = document.getElementById('cart-container');
            const totalEl = document.getElementById('total-price');
            if(cart.length === 0) {
                container.innerHTML = `<p class="text-gray-500 text-sm text-center mt-10">La commande est vide.</p>`;
                totalEl.innerText = "0.00 €";
                return;
            }
            let totalPrix = 0;
            container.innerHTML = cart.map((item, i) => {
                totalPrix += item.price;
                return `<div class="flex justify-between bg-white/5 p-3 rounded-lg border border-white/5"><div class="font-bold text-sm">${item.name}</div><div class="flex gap-4"><div class="text-neon">${item.price.toFixed(2)} €</div><button onclick="window.removeFromCart(${i})" class="text-red-500">X</button></div></div>`;
            }).join('');
            totalEl.innerText = `${totalPrix.toFixed(2)} €`;
        }

        // 7. Encaissement (Avec l'ID du restaurant !)
        document.getElementById('btn-encaissement').addEventListener('click', async () => {
            if(cart.length === 0) return;
            const btn = document.getElementById('btn-encaissement');
            btn.innerText = "ENVOI..."; btn.disabled = true;

            let totalPrix = cart.reduce((acc, item) => acc + item.price, 0);
            let totalTemps = cart.reduce((acc, item) => acc + item.prep_time, 0);

            // Insertion commande AVEC LE RESTAURANT_ID
            await supabase.from('orders').insert([{ 
                client_id: currentClient ? currentClient.id : null,
                restaurant_id: activeRestaurantId,
                total_price: totalPrix, 
                estimated_time: totalTemps,
                status: 'en_preparation'
            }]);

            if (currentClient) {
                const points = Math.floor(totalPrix) * 2;
                await supabase.from('profiles').update({ fidgood_points: currentClient.fidgood_points + points }).eq('id', currentClient.id);
            }

            cart = []; currentClient = null;
            document.getElementById('client-id-input').value = "";
            document.getElementById('client-info').innerHTML = "";
            updateCartUI();
            btn.innerText = "ENCAISSER & ENVOYER"; btn.disabled = false;
        });

        checkAuthStatus();
    </script>
</body>
</html>
