<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Borne - FastGood</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { theme: { extend: { colors: { neon: '#FF0055', dark: '#0a0a0a', darker: '#050505' } } } }</script>
</head>
<body class="bg-dark text-white font-sans antialiased h-screen flex flex-col overflow-hidden">

    <div id="auth-screen" class="absolute inset-0 bg-darker z-50 flex items-center justify-center">
        <div class="bg-dark border border-white/10 p-8 rounded-2xl w-full max-w-md text-center">
            <h2 class="text-3xl font-black mb-4">LANCEMENT BORNE</h2>
            <input type="email" id="staff-email" placeholder="Email Staff" class="w-full bg-darker border border-white/20 rounded-lg px-4 py-3 mb-4">
            <input type="password" id="staff-password" placeholder="Mot de passe" class="w-full bg-darker border border-white/20 rounded-lg px-4 py-3 mb-4">
            <button onclick="loginStaff()" class="w-full bg-neon text-white font-black py-3 rounded-xl">DÉVERROUILLER</button>
        </div>
    </div>

    <div id="app-screen" class="hidden flex-1 flex h-full">
        <!-- Prise de commande -->
        <div class="flex-1 p-4 overflow-y-auto bg-dark border-r border-white/10">
            <!-- Zone Client & Fidélité -->
            <div class="bg-darker p-4 rounded-xl border border-white/20 mb-6">
                <div class="flex gap-4">
                    <input type="text" id="client-id-input" placeholder="N° Client (6 chiffres)" class="bg-dark border border-white/10 rounded-lg px-4 py-3 flex-1 text-lg uppercase focus:border-neon outline-none">
                    <button onclick="searchClient()" class="bg-white text-dark px-6 py-3 rounded-lg font-bold">Identifier</button>
                </div>
                <div id="client-info" class="mt-3 flex justify-between items-center"></div>
                <!-- Zone Réductions -->
                <div id="loyalty-actions" class="hidden mt-4 pt-4 border-t border-white/10 flex gap-4">
                    <select id="promo-select" class="bg-dark border border-white/20 rounded-lg px-4 py-2 outline-none flex-1" onchange="applyDiscounts()">
                        <option value="">-- Aucun code promo --</option>
                    </select>
                    <button id="btn-use-couronnes" onclick="toggleCouronnes()" class="hidden border border-neon text-neon px-4 py-2 rounded-lg font-bold hover:bg-neon hover:text-white transition">🎁 Utiliser 50 Couronnes (-5€)</button>
                </div>
            </div>

            <h2 class="text-xl font-bold mb-4">Produits</h2>
            <div id="borne-menu-container" class="grid grid-cols-2 md:grid-cols-3 gap-4"></div>
        </div>

        <!-- Ticket de caisse -->
        <div class="w-96 bg-darker flex flex-col">
            <div class="p-4 border-b border-white/10"><h2 class="font-black text-xl">Commande</h2></div>
            <div id="cart-container" class="flex-1 p-4 overflow-y-auto space-y-4"></div>
            
            <div class="p-4 bg-dark border-t border-white/10">
                <div class="flex justify-between items-center text-gray-400 text-sm mb-1">
                    <span>Sous-total</span><span id="sub-price">0.00 €</span>
                </div>
                <div id="discount-line" class="hidden flex justify-between items-center text-neon text-sm font-bold mb-2">
                    <span>Avantage Fidélité</span><span id="discount-amount">- 0.00 €</span>
                </div>
                <div class="flex justify-between items-end mb-4 border-t border-white/10 pt-2">
                    <span class="text-gray-400 font-bold">Total à Payer</span>
                    <span class="text-4xl font-black text-white" id="total-price">0.00 €</span>
                </div>
                <button id="btn-encaissement" class="w-full bg-neon text-white py-5 rounded-xl font-black text-xl">ENCAISSER</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { supabase } from './db.js';

        let cart = [];
        let allProducts = [];
        let currentClient = null;
        let availablePromos = [];
        let usingCouronnes = false;
        let discountValue = 0;

        window.loginStaff = async function() {
            const email = document.getElementById('staff-email').value;
            const password = document.getElementById('staff-password').value;
            const { error } = await supabase.auth.signInWithPassword({ email, password });
            if (!error) {
                document.getElementById('auth-screen').classList.add('hidden');
                document.getElementById('app-screen').classList.remove('hidden');
                loadBorneMenu();
            } else alert("Erreur d'identifiants");
        };

        async function loadBorneMenu() {
            const { data: products } = await supabase.from('products').select('*');
            allProducts = products || [];
            document.getElementById('borne-menu-container').innerHTML = allProducts.map(p => `
                <button onclick="window.addToCart('${p.id}')" class="bg-darker border border-white/10 p-4 rounded-xl text-left hover:border-neon">
                    <span class="font-bold text-lg">${p.image_url||''} ${p.name}</span>
                    <span class="text-neon font-black block mt-2">${p.price.toFixed(2)} €</span>
                </button>
            `).join('');
        }

        window.searchClient = async function() {
            const clientNum = document.getElementById('client-id-input').value;
            const { data } = await supabase.from('profiles').select('*').eq('client_number', clientNum).single();
            const infoDiv = document.getElementById('client-info');
            const loyActions = document.getElementById('loyalty-actions');
            
            if (data) {
                currentClient = data;
                infoDiv.innerHTML = `<span class="text-green-400 font-bold">✅ Client ${data.first_name || 'N° '+data.client_number} (👑 ${data.fidgood_points} couronnes)</span>`;
                loyActions.classList.remove('hidden');
                
                // Charger ses codes promos
                const { data: userPromos } = await supabase.from('user_promocodes').select('code').eq('client_id', data.id).eq('is_used', false);
                if (userPromos && userPromos.length > 0) {
                    const codes = userPromos.map(u => u.code);
                    const { data: fullPromos } = await supabase.from('promocodes').select('*').in('code', codes).neq('discount_type', 'points');
                    availablePromos = fullPromos || [];
                    const select = document.getElementById('promo-select');
                    select.innerHTML = '<option value="">-- Aucun code promo --</option>' + availablePromos.map(p => `<option value="${p.code}">${p.code} (-${p.discount_value}${p.discount_type==='percent'?'%':'€'})</option>`).join('');
                }

                // Bouton Couronnes
                const btnCour = document.getElementById('btn-use-couronnes');
                if (data.fidgood_points >= 50) btnCour.classList.remove('hidden'); else btnCour.classList.add('hidden');
                
            } else {
                currentClient = null; availablePromos = []; loyActions.classList.add('hidden');
                infoDiv.innerHTML = `<span class="text-red-500 font-bold">❌ Client introuvable</span>`;
            }
            applyDiscounts();
        };

        window.toggleCouronnes = function() {
            usingCouronnes = !usingCouronnes;
            const btn = document.getElementById('btn-use-couronnes');
            if (usingCouronnes) { btn.classList.add('bg-neon', 'text-white'); btn.innerText = "🎁 50 Couronnes appliquées !"; }
            else { btn.classList.remove('bg-neon', 'text-white'); btn.innerText = "🎁 Utiliser 50 Couronnes (-5€)"; }
            applyDiscounts();
        };

        window.addToCart = function(id) { cart.push(allProducts.find(p => p.id === id)); applyDiscounts(); };
        window.removeFromCart = function(index) { cart.splice(index, 1); applyDiscounts(); };

        window.applyDiscounts = function() {
            const container = document.getElementById('cart-container');
            let sousTotal = cart.reduce((acc, item) => acc + item.price, 0);
            discountValue = 0;

            if(cart.length === 0) {
                container.innerHTML = `<p class="text-gray-500 text-center">Panier vide.</p>`;
                document.getElementById('total-price').innerText = "0.00 €";
                document.getElementById('sub-price').innerText = "0.00 €";
                document.getElementById('discount-line').classList.add('hidden');
                return;
            }

            // Calcul réduc promo
            const selCode = document.getElementById('promo-select')?.value;
            if (selCode) {
                const promo = availablePromos.find(p => p.code === selCode);
                if (promo.discount_type === 'amount') discountValue += promo.discount_value;
                if (promo.discount_type === 'percent') discountValue += sousTotal * (promo.discount_value / 100);
            }

            // Calcul réduc couronnes
            if (usingCouronnes) discountValue += 5;

            // Totaux finaux
            let totalFinal = Math.max(0, sousTotal - discountValue);

            container.innerHTML = cart.map((item, i) => `<div class="flex justify-between p-2 border-b border-white/5"><span class="font-bold">${item.name}</span> <div class="flex gap-4"><span class="text-neon">${item.price.toFixed(2)}€</span> <button onclick="window.removeFromCart(${i})" class="text-red-500">X</button></div></div>`).join('');
            
            document.getElementById('sub-price').innerText = `${sousTotal.toFixed(2)} €`;
            if (discountValue > 0) {
                document.getElementById('discount-line').classList.remove('hidden');
                document.getElementById('discount-amount').innerText = `- ${discountValue.toFixed(2)} €`;
            } else document.getElementById('discount-line').classList.add('hidden');

            document.getElementById('total-price').innerText = `${totalFinal.toFixed(2)} €`;
        };

        document.getElementById('btn-encaissement').addEventListener('click', async () => {
            if(cart.length === 0) return;
            const btn = document.getElementById('btn-encaissement'); btn.disabled = true;

            let totalTemps = cart.reduce((acc, item) => acc + item.prep_time, 0);
            let finalPrice = parseFloat(document.getElementById('total-price').innerText);

            // Créer la commande (Avec items)
            await supabase.from('orders').insert([{ 
                client_id: currentClient ? currentClient.id : null,
                total_price: finalPrice, 
                estimated_time: totalTemps,
                status: 'en_preparation',
                items: cart
            }]);

            // Mettre à jour profil client
            if (currentClient) {
                let nouveauxPoints = currentClient.fidgood_points + (Math.floor(finalPrice) * 2);
                if (usingCouronnes) nouveauxPoints -= 50; // Déduire les 50 couronnes utilisées
                
                await supabase.from('profiles').update({ fidgood_points: nouveauxPoints }).eq('id', currentClient.id);

                // Griller le code promo
                const selCode = document.getElementById('promo-select')?.value;
                if (selCode) await supabase.from('user_promocodes').update({ is_used: true }).eq('client_id', currentClient.id).eq('code', selCode);
                
                alert(`Commande validée ! Nouveau solde: 👑 ${nouveauxPoints} couronnes.`);
            } else {
                alert("Commande validée !");
            }

            // Reset
            cart = []; currentClient = null; usingCouronnes = false; availablePromos = [];
            document.getElementById('client-id-input').value = "";
            document.getElementById('client-info').innerHTML = "";
            document.getElementById('loyalty-actions').classList.add('hidden');
            const btnC = document.getElementById('btn-use-couronnes'); btnC.classList.remove('bg-neon', 'text-white'); btnC.innerText = "🎁 Utiliser 50 Couronnes (-5€)";
            applyDiscounts(); btn.disabled = false;
        });
    </script>
</body>
</html>
