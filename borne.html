<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Borne - FastGood</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { theme: { extend: { colors: { neon: '#FF0055', dark: '#0a0a0a', darker: '#050505' } } } }</script>
</head>
<body class="bg-dark text-white font-sans antialiased h-screen flex flex-col overflow-hidden">

    <!-- ECRAN 1 : CONNEXION STAFF -->
    <div id="auth-screen" class="absolute inset-0 bg-darker z-50 flex items-center justify-center">
        <div class="bg-dark border border-white/10 p-8 rounded-2xl w-full max-w-md text-center">
            <h2 class="text-3xl font-black mb-6">BORNE <span class="text-neon">STAFF</span></h2>
            <input type="email" id="staff-email" placeholder="Email Staff" class="w-full bg-darker border border-white/20 rounded-lg px-4 py-3 mb-4 outline-none">
            <input type="password" id="staff-password" placeholder="Mot de passe" class="w-full bg-darker border border-white/20 rounded-lg px-4 py-3 mb-4 outline-none">
            <button onclick="loginStaff()" class="w-full bg-neon text-white font-black py-3 rounded-xl hover:bg-white hover:text-dark transition">DÉVERROUILLER</button>
        </div>
    </div>

    <!-- ECRAN 2 : CONFIGURATION DU RESTAURANT -->
    <div id="setup-screen" class="hidden absolute inset-0 bg-darker z-40 flex items-center justify-center">
        <div class="bg-dark border border-white/10 p-8 rounded-2xl w-full max-w-md text-center">
            <h2 class="text-2xl font-black mb-6">Choix du Restaurant</h2>
            <select id="restaurant-select" class="w-full bg-darker border border-white/20 rounded-lg px-4 py-3 mb-6 outline-none text-white"></select>
            <button onclick="startBorne()" class="w-full bg-white text-dark font-black py-3 rounded-xl hover:bg-neon hover:text-white transition">LANCER LA CAISSE</button>
        </div>
    </div>

    <!-- ECRAN 3 : CAISSE -->
    <div id="app-screen" class="hidden flex-1 flex flex-col h-full">
        <header class="bg-darker border-b border-white/10 p-4 flex justify-between items-center">
            <div class="text-xl font-black">FAST<span class="text-neon">GOOD</span></div>
            <div id="active-restaurant-name" class="text-gray-400 font-bold bg-white/5 px-4 py-1 rounded-full">...</div>
            <button onclick="logout()" class="text-red-500 text-sm font-bold hover:text-white">Fermer la caisse</button>
        </header>

        <div class="flex flex-1 overflow-hidden">
            <!-- Prise de commande -->
            <div class="flex-1 p-4 overflow-y-auto bg-dark border-r border-white/10">
                <div class="bg-darker p-4 rounded-xl border border-white/20 mb-6">
                    <div class="flex gap-4">
                        <input type="text" id="client-id-input" placeholder="N° Client (6 chiffres)" class="bg-dark border border-white/10 rounded-lg px-4 py-3 flex-1 text-lg uppercase outline-none focus:border-neon">
                        <button onclick="searchClient()" class="bg-white text-dark px-6 py-3 rounded-lg font-bold">Identifier</button>
                    </div>
                    <div id="client-info" class="mt-3"></div>
                    <div id="loyalty-actions" class="hidden mt-4 pt-4 border-t border-white/10 flex gap-4">
                        <select id="promo-select" class="bg-dark border border-white/20 rounded-lg px-4 py-2 outline-none flex-1" onchange="applyDiscounts()"><option value="">-- Aucun code promo --</option></select>
                        <button id="btn-use-couronnes" onclick="toggleCouronnes()" class="hidden border border-neon text-neon px-4 py-2 rounded-lg font-bold hover:bg-neon hover:text-white transition">🎁 Utiliser 50 Couronnes (-5€)</button>
                    </div>
                </div>
                <h2 class="text-xl font-bold mb-4">Produits</h2>
                <div id="borne-menu-container" class="grid grid-cols-2 md:grid-cols-3 gap-4"></div>
            </div>

            <!-- Ticket -->
            <div class="w-96 bg-darker flex flex-col">
                <div class="p-4 border-b border-white/10"><h2 class="font-black text-xl">Commande</h2></div>
                <div id="cart-container" class="flex-1 p-4 overflow-y-auto space-y-4"></div>
                <div class="p-4 bg-dark border-t border-white/10">
                    <div class="flex justify-between items-center text-gray-400 text-sm mb-1"><span>Sous-total</span><span id="sub-price">0.00 €</span></div>
                    <div id="discount-line" class="hidden flex justify-between items-center text-neon text-sm font-bold mb-2"><span>Avantage</span><span id="discount-amount">- 0.00 €</span></div>
                    <div class="flex justify-between items-end mb-4 border-t border-white/10 pt-2"><span class="text-gray-400 font-bold">Total à Payer</span><span class="text-4xl font-black text-white" id="total-price">0.00 €</span></div>
                    <button id="btn-encaissement" class="w-full bg-neon text-white py-5 rounded-xl font-black text-xl hover:bg-white hover:text-neon transition">ENCAISSER</button>
                </div>
            </div>
        </div>
    </div>

    <!-- SCRIPT -->
    <script type="module">
        import { supabase } from './db.js';

        let cart = []; let allProducts = []; let currentClient = null; let availablePromos = []; let usingCouronnes = false; let activeRestaurantId = null; let discountValue = 0;

        window.loginStaff = async function() {
            const email = document.getElementById('staff-email').value;
            const password = document.getElementById('staff-password').value;
            const { error } = await supabase.auth.signInWithPassword({ email, password });
            if (!error) checkAuth(); else alert("Identifiants incorrects");
        };
        window.logout = async function() { await supabase.auth.signOut(); window.location.reload(); };

        async function checkAuth() {
            const { data: { session } } = await supabase.auth.getSession();
            if (session) {
                document.getElementById('auth-screen').classList.add('hidden');
                document.getElementById('setup-screen').classList.remove('hidden');
                const { data: restos } = await supabase.from('restaurants').select('*');
                document.getElementById('restaurant-select').innerHTML = restos?.length ? restos.map(r => `<option value="${r.id}">${r.name}</option>`).join('') : '<option value="">Aucun resto configuré</option>';
            }
        }

        window.startBorne = function() {
            const select = document.getElementById('restaurant-select');
            activeRestaurantId = select.value;
            document.getElementById('active-restaurant-name').innerText = select.options[select.selectedIndex].text;
            document.getElementById('setup-screen').classList.add('hidden');
            document.getElementById('app-screen').classList.remove('hidden');
            loadMenu();
        };

        async function loadMenu() {
            const { data } = await supabase.from('products').select('*');
            allProducts = data || [];
            document.getElementById('borne-menu-container').innerHTML = allProducts.map(p => `
                <button onclick="window.addToCart('${p.id}')" class="bg-darker border border-white/10 p-4 rounded-xl text-left hover:border-neon transition"><span class="font-bold text-lg">${p.image_url||''} ${p.name}</span><span class="text-neon font-black block mt-2">${p.price.toFixed(2)} €</span></button>
            `).join('');
        }

        window.searchClient = async function() {
            const clientNum = document.getElementById('client-id-input').value;
            const { data } = await supabase.from('profiles').select('*').eq('client_number', clientNum).single();
            if (data) {
                currentClient = data;
                document.getElementById('client-info').innerHTML = `<span class="text-green-400 font-bold bg-green-400/10 px-2 py-1 rounded text-sm">✅ Client trouvé (👑 ${data.fidgood_points} couronnes)</span>`;
                document.getElementById('loyalty-actions').classList.remove('hidden');
                
                const { data: userPromos } = await supabase.from('user_promocodes').select('code').eq('client_id', data.id).eq('is_used', false);
                if (userPromos?.length) {
                    const { data: fullPromos } = await supabase.from('promocodes').select('*').in('code', userPromos.map(u=>u.code)).neq('discount_type', 'points');
                    availablePromos = fullPromos || [];
                    document.getElementById('promo-select').innerHTML = '<option value="">-- Aucun code promo --</option>' + availablePromos.map(p => `<option value="${p.code}">${p.code} (-${p.discount_value}${p.discount_type==='percent'?'%':'€'})</option>`).join('');
                }
                const btnCour = document.getElementById('btn-use-couronnes');
                if (data.fidgood_points >= 50) btnCour.classList.remove('hidden'); else btnCour.classList.add('hidden');
            } else {
                currentClient = null; availablePromos = []; document.getElementById('loyalty-actions').classList.add('hidden');
                document.getElementById('client-info').innerHTML = `<span class="text-red-500 font-bold bg-red-500/10 px-2 py-1 rounded text-sm">❌ Introuvable</span>`;
            }
            applyDiscounts();
        };

        window.toggleCouronnes = function() {
            usingCouronnes = !usingCouronnes;
            const btn = document.getElementById('btn-use-couronnes');
            if (usingCouronnes) { btn.classList.add('bg-neon', 'text-white'); btn.innerText = "🎁 50 Couronnes appliquées !"; }
            else { btn.classList.remove('bg-neon', 'text-white'); btn.innerText = "🎁 Utiliser 50 Couronnes (-5€)"; }
            applyDiscounts();
        };

        window.addToCart = function(id) { cart.push(allProducts.find(p => p.id === id)); applyDiscounts(); };
        window.removeFromCart = function(i) { cart.splice(i, 1); applyDiscounts(); };

        window.applyDiscounts = function() {
            const container = document.getElementById('cart-container');
            let sousTotal = cart.reduce((acc, item) => acc + item.price, 0); discountValue = 0;
            if(cart.length === 0) {
                container.innerHTML = `<p class="text-gray-500 text-center py-10">Panier vide.</p>`;
                document.getElementById('total-price').innerText = "0.00 €"; document.getElementById('sub-price').innerText = "0.00 €"; document.getElementById('discount-line').classList.add('hidden'); return;
            }
            const selCode = document.getElementById('promo-select')?.value;
            if (selCode) {
                const promo = availablePromos.find(p => p.code === selCode);
                if (promo.discount_type === 'amount') discountValue += promo.discount_value;
                if (promo.discount_type === 'percent') discountValue += sousTotal * (promo.discount_value / 100);
            }
            if (usingCouronnes) discountValue += 5;
            let totalFinal = Math.max(0, sousTotal - discountValue);

            container.innerHTML = cart.map((item, i) => `<div class="flex justify-between bg-white/5 p-3 rounded-lg border border-white/5 mb-2"><span class="font-bold text-sm">${item.name}</span> <div class="flex gap-4"><span class="text-neon font-bold">${item.price.toFixed(2)}€</span> <button onclick="window.removeFromCart(${i})" class="text-red-500 font-bold hover:text-white">X</button></div></div>`).join('');
            document.getElementById('sub-price').innerText = `${sousTotal.toFixed(2)} €`;
            if (discountValue > 0) { document.getElementById('discount-line').classList.remove('hidden'); document.getElementById('discount-amount').innerText = `- ${discountValue.toFixed(2)} €`; } 
            else document.getElementById('discount-line').classList.add('hidden');
            document.getElementById('total-price').innerText = `${totalFinal.toFixed(2)} €`;
        };

        document.getElementById('btn-encaissement').addEventListener('click', async () => {
            if(cart.length === 0) return;
            document.getElementById('btn-encaissement').disabled = true;
            let totalTemps = cart.reduce((acc, item) => acc + item.prep_time, 0);
            let finalPrice = parseFloat(document.getElementById('total-price').innerText);

            await supabase.from('orders').insert([{ client_id: currentClient?.id || null, restaurant_id: activeRestaurantId, total_price: finalPrice, estimated_time: totalTemps, status: 'en_preparation', items: cart }]);

            if (currentClient) {
                let nouveauxPoints = currentClient.fidgood_points + (Math.floor(finalPrice) * 2);
                if (usingCouronnes) nouveauxPoints -= 50;
                await supabase.from('profiles').update({ fidgood_points: nouveauxPoints }).eq('id', currentClient.id);
                const selCode = document.getElementById('promo-select')?.value;
                if (selCode) await supabase.from('user_promocodes').update({ is_used: true }).eq('client_id', currentClient.id).eq('code', selCode);
                alert(`Commande envoyée ! Nouveau solde: 👑 ${nouveauxPoints} couronnes.`);
            } else alert("Commande envoyée en cuisine !");

            cart = []; currentClient = null; usingCouronnes = false; availablePromos = [];
            document.getElementById('client-id-input').value = ""; document.getElementById('client-info').innerHTML = ""; document.getElementById('loyalty-actions').classList.add('hidden');
            const btnC = document.getElementById('btn-use-couronnes'); btnC.classList.remove('bg-neon', 'text-white'); btnC.innerText = "🎁 Utiliser 50 Couronnes (-5€)";
            applyDiscounts(); document.getElementById('btn-encaissement').disabled = false;
        });

        checkAuth();
    </script>
</body>
</html>
